<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1C1C1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mais Delivery">
<title>Turnos — Mais Delivery</title>
<style>
/* ══ VARS ══ */
:root{
  --bg:#1C1C1E;--card:#2C2C2E;--card2:#3A3A3C;--sep:#48484A;--sep2:#3A3A3C;
  --text:#FFF;--text2:rgba(255,255,255,.6);--text3:rgba(255,255,255,.28);
  --accent:#0A84FF;--green:#30D158;--green-d:#1DB954;--green-bg:#0D3320;
  --orange:#FF9F0A;--orange-d:#C93400;--orange-bg:#3D2800;
  --red:#FF453A;--red-d:#C41230;--red-bg:#3D0A0A;
  --blue:#0A84FF;--blue-d:#0040DD;--blue-bg:#001A3D;
  --purple:#BF5AF2;--teal:#5AC8FA;
  --tab-bar:rgba(28,28,30,.96);--tab-border:rgba(255,255,255,.1);
  --radius:12px;--radius-lg:16px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --nav-w:220px;
}
html.force-light{color-scheme:light;
  --bg:#F2F2F7;--card:#FFF;--card2:#F2F2F7;--sep:#C6C6C8;--sep2:#E5E5EA;
  --text:#000;--text2:rgba(0,0,0,.6);--text3:rgba(0,0,0,.3);
  --green-bg:#D4F0DC;--orange-bg:#FFF3CD;--red-bg:#FFE5E5;--blue-bg:#D6EAFF;
  --tab-bar:rgba(249,249,249,.96);--tab-border:rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif}
/* ══ LOGIN ══ */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:32px;gap:16px}
.lg-logo{font-size:60px}
.lg-title{font-size:30px;font-weight:700;letter-spacing:-.5px}
.lg-sub{font-size:15px;color:var(--text3)}
.lg-box{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;margin-top:8px}
.lg-inp{width:100%;background:var(--card);border:1.5px solid var(--sep);border-radius:var(--radius);padding:14px 16px;font-size:16px;color:var(--text);outline:none;font-family:inherit;transition:border-color .2s}
.lg-inp:focus{border-color:var(--accent)}
.lg-btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:15px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.lg-err{color:var(--red);font-size:14px;text-align:center;min-height:18px}
/* ══ APP SHELL ══ */
#app{display:none;height:100%}
#app.visible{display:flex;flex-direction:column}
.screens{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding-bottom:calc(80px + var(--safe-b))}
.screen.active{display:block}
.tab-bar{
  background:var(--tab-bar);border-top:1px solid var(--tab-border);
  display:flex;padding:8px 0 calc(8px + var(--safe-b));flex-shrink:0;
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:transparent;cursor:pointer;color:var(--text3);font-family:inherit;padding:2px 0;transition:color .2s}
.tab-btn.active{color:var(--accent)}
.tab-icon{font-size:22px;line-height:1.2}
.tab-label{font-size:10px;font-weight:500}
@media(min-width:768px){
  #app.visible{flex-direction:row-reverse}
  .tab-bar{
    flex-direction:column;width:var(--nav-w);height:100%;
    border-top:none;border-left:1px solid var(--tab-border);
    padding:20px 0;gap:4px;
  }
  .tab-btn{flex:none;flex-direction:row;justify-content:flex-start;
    padding:12px 20px;gap:12px;height:48px;font-size:14px;border-radius:10px;margin:0 8px;width:calc(100% - 16px);}
  .tab-btn.active{background:rgba(10,132,255,.15)}
  .tab-icon{font-size:20px}
  .tab-label{font-size:14px;font-weight:500}
  .screens{flex:1;height:100%}
  .screen{padding-bottom:8px}
  .tab-bar-top{padding:16px 16px 8px;border-bottom:1px solid var(--sep);margin-bottom:8px}
  .tab-bar-title{font-size:18px;font-weight:700}
  .tab-bar-bottom{margin-top:auto;padding:8px 8px 16px;border-top:1px solid var(--sep)}
}
.navbar{padding:52px 16px 8px;display:flex;align-items:flex-end;justify-content:space-between}
.navbar-title{font-size:34px;font-weight:700;letter-spacing:-.5px}
.navbar-sub{font-size:13px;color:var(--text3);margin-top:1px}
.sec-hdr{padding:22px 32px 6px;font-size:13px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border-radius:var(--radius-lg);margin:0 16px 12px;overflow:hidden}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:12px}
.stat-card{background:var(--card);border-radius:var(--radius-lg);padding:13px 15px}
.stat-val{font-size:28px;font-weight:700;line-height:1;margin-bottom:2px}
.stat-lbl{font-size:13px;color:var(--text2)}
.c-green{color:var(--green-d)}.c-blue{color:var(--blue)}.c-red{color:var(--red)}.c-orange{color:var(--orange)}
.banner{margin:0 16px 12px;border-radius:var(--radius);padding:11px 13px;display:flex;gap:9px;align-items:flex-start}
.banner-fri{background:var(--orange-bg);cursor:pointer}
.banner-text{font-size:13px;font-weight:500;color:var(--orange);line-height:1.4}
.day-card{background:var(--card);border-radius:var(--radius-lg);margin:0 16px 10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.day-card.pinned{box-shadow:0 4px 18px rgba(0,0,0,.3)}
.day-card.alert-card{border:1.5px solid var(--red)}
.day-hdr{display:flex;align-items:center;padding:12px 16px 10px;border-bottom:1px solid var(--sep2);gap:8px}
.day-name{font-size:17px;font-weight:600;flex:1}
.dbadge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.db-today{background:var(--accent);color:#fff}
.db-tom{background:var(--sep2);color:var(--text2)}
.db-crit{background:var(--orange-bg);color:var(--orange)}
.period{border-bottom:1px solid var(--sep2)}
.period:last-child{border-bottom:none}
.period-hdr{display:flex;align-items:center;padding:8px 16px;background:var(--bg);gap:8px}
.period-lbl{font-size:13px;font-weight:600;color:var(--text2);flex:1;line-height:1.3}
.period-right{display:flex;align-items:center;gap:7px}
.prog-track{width:38px;height:3px;background:var(--sep2);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .3s}
.prog-ok{background:var(--green)}.prog-warn{background:var(--red)}
.prog-cnt{font-size:12px;font-weight:700}
.res-tag{font-size:11px;font-weight:600;color:var(--green-d);background:var(--green-bg);padding:2px 7px;border-radius:20px}
.alert-row{background:var(--red-bg);padding:5px 16px;font-size:12px;font-weight:600;color:var(--red)}
.slot-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--sep2)}
.slot-row:last-child{border-bottom:none}
.slot-row.dispensed{opacity:.5}
.slot-row.dispensed .slot-name{text-decoration:line-through}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;color:#fff;position:relative}
.av.pulse::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--orange);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.18)}}
.slot-body{flex:1;min-width:0}
.slot-name{font-size:15px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.slot-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.slot-time{font-size:12px;color:var(--text3);background:var(--bg);padding:2px 8px;border-radius:20px;border:1px solid var(--sep2);cursor:pointer}
.slot-obs{font-size:12px;color:var(--text2);font-style:italic}
.slot-right{display:flex;align-items:center;gap:5px;flex-shrink:0}
.spill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;border:none;cursor:pointer;font-family:inherit;white-space:nowrap;-webkit-appearance:none;transition:all .2s}
.sp-pend{background:var(--sep2);color:var(--text2)}
.sp-wait{background:var(--orange-bg);color:var(--orange)}
.sp-conf{background:var(--green-bg);color:var(--green-d)}
.sp-disp{background:var(--red-bg);color:var(--red);text-decoration:line-through}
.badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px}
.b-res{background:var(--orange-bg);color:var(--orange)}
.b-nov{background:var(--green-bg);color:var(--green-d)}
.b-int{background:var(--blue-bg);color:var(--blue)}
.dl-ok{font-size:11px;color:var(--text3)}
.dl-warn{font-size:11px;font-weight:600;color:var(--orange)}
.dl-crit{font-size:11px;font-weight:700;color:var(--red)}
.wa-btn{width:32px;height:32px;border-radius:50%;background:var(--green-bg);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px;flex-shrink:0;border:none;cursor:pointer;transition:all .2s}
.wa-btn.off{background:var(--sep2);opacity:.3;pointer-events:none}
.del-btn{width:26px;height:26px;border:1px solid var(--sep);border-radius:7px;background:transparent;color:var(--text3);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.empty-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--sep2)}
.empty-row:last-child{border-bottom:none}
.empty-av{width:34px;height:34px;border-radius:50%;border:1.5px dashed var(--sep);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:20px;flex-shrink:0}
.empty-av.red-av{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.empty-row.alert-slot{background:var(--red-bg)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.alert-slot .empty-av{animation:blink 2s infinite}
.add-row{padding:9px 16px}
.add-btn{display:flex;align-items:center;gap:5px;font-size:15px;color:var(--accent);background:transparent;border:none;cursor:pointer;font-family:inherit;font-weight:500}
.small-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:10px}
.small-card{background:var(--card);border-radius:var(--radius);padding:11px 12px;cursor:pointer;transition:opacity .2s}
.small-card.alert-card{border:1.5px solid var(--red)}
.sc-name{font-size:13px;font-weight:600;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
.sc-period{margin-bottom:4px}
.sc-lbl{font-size:10px;color:var(--text3);margin-bottom:2px;display:flex;justify-content:space-between}
.sc-avs{display:flex;gap:2px}
.sc-av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff}
.tl-day-nav{display:flex;gap:7px;padding:0 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tl-day-nav::-webkit-scrollbar{display:none}
.tl-day-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--sep);background:transparent;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit}
.tl-day-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tl-wrap{margin:0 16px;background:var(--card);border-radius:var(--radius-lg);overflow:hidden}
.tl-canvas{position:relative;user-select:none}
.tl-hour-col{position:absolute;left:0;top:0;width:44px;bottom:0;z-index:2}
.tl-hour-lbl{position:absolute;right:6px;font-size:10px;font-weight:500;color:var(--text3);transform:translateY(-50%)}
.tl-grid-lines{position:absolute;left:44px;right:0;top:0;bottom:0;z-index:1}
.tl-grid-line{position:absolute;left:0;right:0;border-top:1px solid var(--sep2)}
.tl-grid-line.major{border-color:var(--sep)}
.tl-slots-layer{position:absolute;left:44px;right:0;top:0;bottom:0;z-index:3}
.tl-block{position:absolute;border-radius:6px;overflow:hidden;cursor:pointer;touch-action:none}
.tl-block-inner{position:absolute;inset:0;border-radius:6px;padding:3px 6px;overflow:hidden}
.tl-block-name{font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-block-time{font-size:10px;color:rgba(255,255,255,.8)}
.tl-drag-top,.tl-drag-bot{position:absolute;left:0;right:0;height:10px;cursor:ns-resize;z-index:10}
.tl-drag-top{top:0}.tl-drag-bot{bottom:0}
.tl-now-line{position:absolute;left:44px;right:0;z-index:8;pointer-events:none}
.tl-now-inner{border-top:2px solid var(--red);position:relative}
.tl-now-dot{width:8px;height:8px;background:var(--red);border-radius:50%;position:absolute;left:-4px;top:-5px}
.tl-legend{display:flex;gap:10px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--sep2)}
.tl-leg{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}
.moto-item{display:flex;align-items:flex-start;gap:11px;padding:12px 16px;border-bottom:1px solid var(--sep2)}
.moto-item:last-child{border-bottom:none}
.m-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.m-body{flex:1;min-width:0}
.m-name-row{font-size:16px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.m-line{font-size:13px;color:var(--text2);margin-bottom:1px}
.hist-dots{display:flex;gap:3px;margin-top:4px}
.hd{width:9px;height:9px;border-radius:50%}
.hd-ok{background:var(--green)}.hd-miss{background:var(--red)}.hd-empty{background:var(--sep)}
.m-acts{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.icon-btn{width:32px;height:32px;border:1px solid var(--sep);border-radius:10px;background:transparent;color:var(--text2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cfg-card{background:var(--card);border-radius:var(--radius-lg);margin:0 16px;overflow:hidden}
.cfg-group-hdr{font-size:13px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;padding:20px 32px 6px}
.cfg-row{display:flex;align-items:center;padding:11px 16px;background:var(--card);border-bottom:1px solid var(--sep2);gap:8px}
.cfg-row:last-child{border-bottom:none}
.cfg-lbl{font-size:15px;flex:1}
.cfg-sub{font-size:12px;color:var(--text3)}
.cfg-inp{width:56px;padding:6px 8px;font-size:15px;border:1px solid var(--sep);border-radius:8px;background:var(--card2);color:var(--text);text-align:center;font-family:inherit}
.cfg-inp-time{width:82px;padding:6px 8px;font-size:13px;border:1px solid var(--sep);border-radius:8px;background:var(--card2);color:var(--text);text-align:center;font-family:inherit}
.cfg-val-col{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.crit-row{display:flex;align-items:center;gap:9px;padding:11px 16px;background:var(--card);border-bottom:1px solid var(--sep2)}
.crit-row:last-child{border-bottom:none}
.crit-n{width:21px;height:21px;border-radius:50%;background:var(--orange-bg);color:var(--orange);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.arr-btn{width:30px;height:30px;border:1px solid var(--sep);border-radius:8px;background:transparent;font-size:16px;cursor:pointer;color:var(--text2)}
.del-turno{width:28px;height:28px;border:1px solid var(--red);border-radius:8px;background:var(--red-bg);color:var(--red);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.f-btn{width:100%;padding:13px;border-radius:var(--radius);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;border:none}
.f-btn-dest{background:var(--red-bg);color:var(--red);border:1px solid var(--red)}
.add-turno-btn{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--accent);background:transparent;border:none;cursor:pointer;font-family:inherit;font-weight:500;padding:11px 16px}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(20px + var(--safe-b))}
.sheet-handle{width:36px;height:4px;background:var(--sep);border-radius:2px;margin:12px auto 14px}
.sheet-title{font-size:17px;font-weight:600;padding:0 20px 13px;border-bottom:1px solid var(--sep2)}
.sheet-body{padding:16px 20px}
.s-label{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:5px;display:block}
.s-inp{width:100%;padding:12px 13px;font-size:16px;border:1px solid var(--sep);border-radius:var(--radius);background:var(--card2);color:var(--text);font-family:inherit;-webkit-appearance:none;margin-bottom:11px}
.s-inp:focus{outline:none;border-color:var(--accent)}
.s-sel{width:100%;padding:12px 13px;font-size:16px;border:1px solid var(--sep);border-radius:var(--radius);background:var(--card2);color:var(--text);font-family:inherit;-webkit-appearance:none;margin-bottom:11px}
.s-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.s-chk{display:flex;gap:18px;margin-bottom:13px}
.s-chk label{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--text2)}
.s-chk input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.sheet-acts{display:flex;gap:9px;padding-top:3px}
.sheet-acts button{flex:1;padding:13px;border-radius:var(--radius);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;border:none}
.s-cancel{background:var(--sep2);color:var(--text2)}
.s-ok{background:var(--accent);color:#fff}
.batch-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--sep2)}
.batch-item:last-child{border-bottom:none}
#sync-pill{position:fixed;top:calc(12px + var(--safe-t));left:12px;z-index:600;background:var(--card);border:1px solid var(--sep);border-radius:20px;padding:4px 12px;font-size:12px;display:none;align-items:center;gap:6px;pointer-events:none}
#sync-pill.show{display:flex}
#sync-pill.syncing{color:var(--orange)}
#sync-pill.ok{color:var(--green-d)}
#sync-pill.err{color:var(--red)}
#top-ctrl{position:fixed;top:calc(10px + var(--safe-t));right:14px;z-index:400;display:flex;gap:8px}
.ctrl-btn{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;background:rgba(120,120,128,.2);backdrop-filter:blur(12px);color:var(--text);transition:all .2s;font-family:inherit}
@media(min-width:768px){#top-ctrl{display:none}}
</style>
</head>
<body>
<div id="sync-pill"><span id="sp-icon">⟳</span><span id="sp-text">Carregando...</span></div>
<div id="top-ctrl">
  <button class="ctrl-btn" id="btn-theme" onclick="toggleTheme()" title="Tema">🌓</button>
</div>
<!-- LOGIN -->
<div id="login-screen">
  <div class="lg-logo">🛵</div>
  <div class="lg-title">Turnos</div>
  <div class="lg-sub">Gestão de Entregadores</div>
  <div class="lg-box">
    <input class="lg-inp" type="password" id="lg-pw" placeholder="Senha de acesso" autocomplete="current-password">
    <button class="lg-btn" onclick="tryLogin()">Entrar</button>
    <div class="lg-err" id="lg-err"></div>
  </div>
</div>
<!-- APP -->
<div id="app">
  <div class="screens">
    <div id="screen-horarios" class="screen active"></div>
    <div id="screen-cobertura" class="screen"></div>
    <div id="screen-performance" class="screen"></div>
    <div id="screen-config" class="screen"></div>
  </div>
  <nav class="tab-bar" id="tab-bar">
    <div class="tab-bar-top" style="display:none" id="sidebar-hdr">
      <div class="tab-bar-title">🛵 Turnos</div>

async function loadFromGist(){
  if(!GIST_TOKEN){showSync('err','Token não configurado');return;}
  try{
    showSync('syncing','Carregando...');
    const r=await fetch(`https://api.github.com/gists/${GIST_ID}`,{headers:{'Authorization':`token ${GIST_TOKEN}`,'Accept':'application/vnd.github.v3+json'}});
    if(!r.ok)throw new Error();
    const data=await r.json();
    const raw=data.files[GIST_FILE]?.content;
    if(raw&&raw!=='{}'){ 
      const p=JSON.parse(raw);
      if(p.motos){motos=p.motos;sv('motos',motos)}
      if(p.schedule){schedule=p.schedule;sv('schedule',schedule)}
      if(p.turnos){turnos=p.turnos;sv('turnos',turnos)}
      if(p.critOrder){critOrder=p.critOrder;sv('critOrder',critOrder)}
      if(p.performance){performance=p.performance;sv('performance',performance)}
      if(p.changeLog){changeLog=p.changeLog;sv('changeLog',changeLog)}
      if(p.nextId){nextId=p.nextId;sv('nextId',nextId)}
      lastSync=raw;
    }
    showSync('ok','Sincronizado');
  }catch(e){showSync('err','Dados locais');console.warn(e)}
}
async function saveToGist(){
  if(!GIST_TOKEN){return;}
  const payload=JSON.stringify({motos,schedule,turnos,critOrder,performance,changeLog,nextId});
  if(payload===lastSync)return;
  lastSync=payload;
  showSync('syncing','Salvando...');
  try{
    const r=await fetch(`https://api.github.com/gists/${GIST_ID}`,{
      method:'PATCH',
      headers:{'Authorization':`token ${GIST_TOKEN}`,'Content-Type':'application/json'},
      body:JSON.stringify({files:{[GIST_FILE]:{content:payload}}})
    });
    if(!r.ok)throw new Error();
    showSync('ok','Salvo ✓');
  }catch(e){showSync('err','Erro ao salvar');console.warn(e)}
}

function deadlineEl(dl,status){

function playSound(type){
  if(!soundEnabled)return;
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    if(type==='alert'){o.frequency.value=880;g.gain.setValueAtTime(.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.4);}
    else if(type==='confirm'){o.frequency.value=440;g.gain.setValueAtTime(.2,ctx.currentTime);o.frequency.linearRampToValueAtTime(660,ctx.currentTime+.2);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.5);}
    else{o.frequency.value=330;g.gain.setValueAtTime(.15,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);}
    o.start();o.stop(ctx.currentTime+.5);
  }catch{}
}

}

  const order=['pending','waiting','confirmed','dispensed'];
  const cur=order.indexOf(s.status);
  const next=order[(cur+1)%order.length];
  const prev=s.status;
  if(next==='dispensed'){
    if(!confirm(`Dispensar ${moto(s.id)?.name}?`))return;
    addLog(s.id,prev,next,'manual','');
    playSound('alert');
  } else if(next==='confirmed'){playSound('confirm')}
  s.status=next;
  persist();renderHorarios();
}

  s.sentAt=new Date().toISOString();

      </div>

    </div>`;
  });

    const nm=now.getHours()*60+now.getMinutes()-MINHOUR*60;
    if(nm>=0&&nm<=totalMins)h+=`<div class="tl-now-line" style="top:${nm*PX}px"><div class="tl-now-inner"><div class="tl-now-dot"></div></div></div>`;

function tlDragStart(e,edge,period,idx){
  e.stopPropagation();e.preventDefault();
  const PX=2.8,MINHOUR=6;
  const slot=schedule[tlDay]?.[period]?.[idx];if(!slot)return;
  const t=getTurnos(tlDay)[period];
  const toMin=str=>{const[hh,mm]=str.split(':').map(Number);return hh*60+(mm||0)};
  const minToStr=m=>{const h=Math.floor(m/60)%24,mm=m%60;return`${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}`};
  const startY=e.touches?e.touches[0].clientY:e.clientY;
  const origMin=toMin(edge==='top'?(slot.timeStart||t.start):(slot.timeEnd||t.end));
  function move(ev){
    const y=ev.touches?ev.touches[0].clientY:ev.clientY;
    const delta=Math.round((y-startY)/PX/15)*15;
    const newMin=Math.max(MINHOUR*60,Math.min(24*60-15,origMin+delta));
    const newStr=minToStr(newMin);
    if(edge==='top')slot.timeStart=newStr;else slot.timeEnd=newStr;
    const el=document.querySelector(`[data-p="${period}"][data-i="${idx}"][data-d="${tlDay}"]`);
    if(el){
      const ts=slot.timeStart||t.start,te=slot.timeEnd||t.end;
      const sm=toMin(ts)-MINHOUR*60,em=toMin(te)-MINHOUR*60;
      el.style.top=Math.max(0,sm*PX)+'px';
      el.style.height=Math.max(24,(em-sm)*PX)+'px';
      const nm=el.querySelector('.tl-block-name');
      const tm=el.querySelector('.tl-block-time');
      if(nm)nm.textContent=ini(moto(slot.id)?.name||'?')+' '+ts;
      if(tm)tm.textContent=ts+'–'+te;
    }
  }
  function up(){
    persist();
    document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);
    document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);
  }
  document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
  document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);
}
// ── PERFORMANCE ──
function getPeriodDates(){
  const now=new Date(),toStr=d=>d.toISOString().slice(0,10);
  if(perfPeriod.type==='month'){return{from:toStr(new Date(now.getFullYear(),now.getMonth(),1)),to:toStr(now)}}
  if(perfPeriod.type==='30d'){return{from:toStr(new Date(now-30*864e5)),to:toStr(now)}}
  if(perfPeriod.type==='90d'){return{from:toStr(new Date(now-90*864e5)),to:toStr(now)}}
  if(perfPeriod.type==='custom'){return{from:perfPeriod.from||toStr(new Date(now-30*864e5)),to:perfPeriod.to||toStr(now)}}
  return{from:'2020-01-01',to:toStr(now)};
}
function getPerfForPeriod(motoId){
  const{from,to}=getPeriodDates();
  const perf=performance[motoId]||{};
  const deliveries=(perf.deliveries||[]).filter(d=>d.date>=from&&d.date<=to);
  const totalDel=deliveries.length;
  const totalFrete=deliveries.reduce((a,b)=>a+(b.frete||0),0);
  const avgTime=totalDel>0?deliveries.reduce((a,b)=>a+(b.tempo||0),0)/totalDel:0;
  const clientRating=perf.clientRating||0;
  const clientCount=perf.clientCount||0;
  const internalScore=perf.internalScore||0;
  const dayCount={};
  deliveries.forEach(d=>{if(d.dow!=null)dayCount[d.dow]=(dayCount[d.dow]||0)+1});
  return{totalDel,totalFrete,avgTime,clientRating,clientCount,internalScore,dayCount,deliveries};
}
function calcScore(motoId){
  try{
    const m=moto(motoId);if(!m)return 0;
    const{totalDel,avgTime,clientRating,clientCount,internalScore}=getPerfForPeriod(motoId);
    const hist=m.history||[];
    const presScore=hist.length?hist.reduce((a,b)=>a+b,0)/hist.length:0.5;
    const logs=changeLog.filter(l=>l.motoId===motoId&&l.toStatus==='dispensed');
    const lateCancel=logs.filter(l=>l.note&&l.note.includes('cima')).length;
    const punctScore=Math.max(0,1-(lateCancel*0.15));
    const clientScore=clientCount>0?(clientRating/5)*Math.min(1,Math.log10(clientCount+1)/2):0;
    const allDel=motos.map(mm=>getPerfForPeriod(mm.id).totalDel);
    const maxDel=Math.max(...allDel,1);
    const delivScore=totalDel/maxDel;
    const allTimes=motos.map(mm=>getPerfForPeriod(mm.id).avgTime).filter(t=>t>0);
    const minT=allTimes.length?Math.min(...allTimes):0,maxT=allTimes.length?Math.max(...allTimes):1;
    const timeScore=avgTime>0?1-((avgTime-minT)/Math.max(maxT-minT,1)):0.5;
    const intScore=internalScore/5;
    const raw=presScore*0.30+punctScore*0.20+clientScore*0.20+delivScore*0.10+timeScore*0.10+intScore*0.10;
    return Math.round(raw*100)/10;
  }catch{return 0}
}

      ${i>0?`<button class="arr-btn" onclick="moveCrit(${i},-1)">↑</button>`:\'<div style="width:30px"></div>\'}
      ${i<critOrder.length-1?`<button class="arr-btn" onclick="moveCrit(${i},1)">↓</button>`:\'<div style="width:30px"></div>\'}
    </div>`).join('')}
  </div>`;
  h+=`<div style="padding:16px;margin-bottom:8px">
    <button class="f-btn f-btn-dest" onclick="resetGrade()">🔄 Resetar grade da semana</button>
    <button onclick="logout()" style="width:100%;padding:13px;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid var(--sep);background:transparent;color:var(--text3);margin-top:8px">🚪 Sair</button>
    <p style="font-size:12px;color:var(--text3);text-align:center;margin-top:10px">Dados sincronizados via GitHub Gist</p>
  </div>`;
  document.getElementById('screen-config').innerHTML=h;
}
function setTurno(key,p,field,val){turnos[key][p][field]=val;persist()}
function delTurno(key,p){if(Object.keys(turnos[key]).length<=1){alert('Precisa de ao menos 1 turno.');return}if(!confirm(`Remover "${turnos[key][p].label}"?`))return;delete turnos[key][p];persist();renderConfig()}
function moveCrit(i,dir){const t=critOrder[i+dir];critOrder[i+dir]=critOrder[i];critOrder[i]=t;persist();renderConfig()}
function resetGrade(){if(!confirm('Resetar grade? Entregadores mantidos.'))return;Object.keys(schedule).forEach(d=>{ensurePeriods(+d);getPeriods(+d).forEach(p=>{schedule[d][p]=[]})});persist();renderConfig()}
// ── SHEETS ──
function closeSheet(){document.getElementById('sheet-zone').innerHTML=''}
function openAddSheet(di,period){
  ensurePeriods(di);
  const t=getTurnos(di)[period];
  const existing=(schedule[di][period]||[]).map(s=>s.id).filter(Boolean);
  const opts=motos.filter(m=>!existing.includes(m.id)).sort((a,b)=>a.name.localeCompare(b.name))

    <div class="sheet-handle"></div><div class="sheet-title">Adicionar — ${t?.label||period}</div><div class="sheet-body">
    <label class="s-label">Entregador</label><select class="s-sel" id="as-m"><option value="">— selecionar —</option>${opts}</select>
    <div class="s-grid2"><div><label class="s-label">Início</label><input class="s-inp" type="time" id="as-ts" value="${t?.start||'06:00'}"></div><div><label class="s-label">Fim</label><input class="s-inp" type="time" id="as-te" value="${t?.end||'23:00'}"></div></div>
    <label class="s-label">Status</label><select class="s-sel" id="as-st"><option value="pending">Confirmar</option><option value="waiting">Aguardando</option><option value="confirmed">Confirmado</option></select>
    <label class="s-label">Obs (opcional)</label><input class="s-inp" id="as-obs" type="text" placeholder="ex: chega às 14h">
    <label class="s-label">Confirmar até (opcional)</label><input class="s-inp" id="as-dl" type="text" placeholder="ex: até sex 17h">
    <div class="sheet-acts"><button class="s-cancel" onclick="closeSheet()">Cancelar</button><button class="s-ok" onclick="confirmAddSlot(${di},'${period}')">Adicionar</button></div>
  </div></div></div>`;
}
function confirmAddSlot(di,period){
  const id=+document.getElementById('as-m').value;if(!id){alert('Selecione um entregador.');return}
  ensurePeriods(di);
  schedule[di][period].push({id,timeStart:document.getElementById('as-ts').value,timeEnd:document.getElementById('as-te').value,status:document.getElementById('as-st').value,obs:document.getElementById('as-obs').value.trim(),deadline:document.getElementById('as-dl').value.trim(),sentAt:''});
  persist();closeSheet();renderHorarios();
}
function openEditSlotSheet(di,period,idx){
  const s=schedule[di]?.[period]?.[idx];if(!s||!s.id)return;
  const m=moto(s.id);const t=getTurnos(di)[period];
  document.getElementById('sheet-zone').innerHTML=`<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet">
    <div class="sheet-handle"></div><div class="sheet-title">${m?.name||'Entregador'}</div><div class="sheet-body">
    <div class="s-grid2"><div><label class="s-label">Início</label><input class="s-inp" type="time" id="es-ts" value="${s.timeStart||t?.start||''}" ></div><div><label class="s-label">Fim</label><input class="s-inp" type="time" id="es-te" value="${s.timeEnd||t?.end||''}" ></div></div>
    <label class="s-label">Status</label><select class="s-sel" id="es-st">
      <option value="pending"${s.status==='pending'?' selected':''}>Confirmar</option>
      <option value="waiting"${s.status==='waiting'?' selected':''}>Aguardando</option>
      <option value="confirmed"${s.status==='confirmed'?' selected':''}>Confirmado</option>
      <option value="dispensed"${s.status==='dispensed'?' selected':''}>Dispensado</option>
    </select>
    <label class="s-label">Obs</label><input class="s-inp" id="es-o" type="text" value="${s.obs||''}">
    <label class="s-label">Confirmar até</label><input class="s-inp" id="es-d" type="text" value="${s.deadline||''}">
    <div class="sheet-acts">
      <button class="s-cancel" onclick="removeSlot(${di},'${period}',${idx});closeSheet()" style="background:var(--red-bg);color:var(--red)">Remover</button>
      <button class="s-cancel" onclick="closeSheet()">Cancelar</button>
      <button class="s-ok" onclick="confirmEditSlot(${di},'${period}',${idx})">Salvar</button>
    </div>

function confirmEditSlot(di,period,idx){
  const s=schedule[di][period][idx];
  s.timeStart=document.getElementById('es-ts').value;
  s.timeEnd=document.getElementById('es-te').value;
  s.status=document.getElementById('es-st').value;
  s.obs=document.getElementById('es-o').value.trim();
  s.deadline=document.getElementById('es-d').value.trim();
  persist();closeSheet();if(activeTab==='horarios')renderHorarios();else renderCobertura();
}
function expandDaySheet(di){
  ensurePeriods(di);
  let inner='<div class="sheet-handle"></div><div class="sheet-title">'+DNAMES[di]+'</div>';
  getPeriods(di).forEach(p=>inner+=periodBlock(di,p));
  document.getElementById('sheet-zone').innerHTML='<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet">'+inner+'</div></div>';
}
// ── SHEETS ──
function openBatchSheet(){
  let items='';
  [0,6].forEach(di=>{
    ensurePeriods(di);
    getPeriods(di).forEach(p=>{
      const t=getTurnos(di)[p];
      (schedule[di][p]||[]).forEach((s,i)=>{
        if(!s.id||(s.status!=='pending'&&s.status!=='waiting'))return;
        const m=moto(s.id);if(!m)return;
        const wa=waLink(m.phone,m.name,di,t?.label||p,s.timeStart,s.timeEnd);
        const waCls='wa-btn'+(wa?'':'' off'');
        items+='<div class="batch-item"><div class="m-av" style="background:'+palCol(s.id)+';width:30px;height:30px;font-size:10px">'+ini(m.name)+'</div><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">'+m.name+'</div><div style="font-size:12px;color:var(--text3)">'+DNAMES[di]+' · '+(t?.label||p)+'</div></div><span class="spill '+(SCLASS[s.status]||'sp-pend')+'" style="cursor:default;font-size:10px">'+(SLABELS[s.status])+'</span><a class="'+waCls+'" '+(wa?'href="'+wa+'" target="_blank"':\'')+'>'+WA_SVG+'</a></div>';
      });
    });

  if(!items)items='<div style="padding:20px;text-align:center;color:var(--text3)">Nenhum pendente 🎉</div>';
  document.getElementById('sheet-zone').innerHTML='<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Confirmações — Fim de semana</div><div class="sheet-body">'+items+'</div></div></div>';
}
function openAddTurnoSheet(key,label){
  const html='<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Novo turno — '+label+'</div><div class="sheet-body">'+
  '<label class="s-label">Nome</label><input class="s-inp" type="text" id="nt-label" placeholder="ex: Madrugada">'+
  '<label class="s-label">Emoji</label><input class="s-inp" type="text" id="nt-emoji" placeholder="🌃" maxlength="2">'+

  '<label class="s-label">Mínimo confirmados</label><input class="s-inp" type="number" id="nt-min" value="2" min="0" max="20">'+
  '<div class="sheet-acts"><button class="s-cancel" onclick="closeSheet()">Cancelar</button><button class="s-ok" onclick="confirmAddTurno(\''+key+'\')" >Adicionar</button></div>'+
  '</div></div></div>';

}
function confirmAddTurno(key){
  const label=document.getElementById('nt-label').value.trim();if(!label){alert('Digite o nome.');return}
  const p=label.toLowerCase().replace(/\s+/g,'_');
  turnos[key][p]={label,emoji:document.getElementById('nt-emoji').value.trim(),start:document.getElementById('nt-start').value,end:document.getElementById('nt-end').value,min:parseInt(document.getElementById('nt-min').value)||0};

function openAddMotoSheet(){
  const h='<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Novo Entregador</div><div class="sheet-body">'+'<label class="s-label">Nome</label><input class="s-inp" type="text" id="nm-name" placeholder="Nome completo">'+'<label class="s-label">WhatsApp</label><input class="s-inp" type="tel" id="nm-phone" placeholder="69999999999">'+'<label class="s-label">Disponibilidade</label><input class="s-inp" type="text" id="nm-disp" placeholder="ex: noites seg-sex">'+'<label class="s-label">Tipo</label><select class="s-sel" id="nm-tipo"><option value="externo">Externo</option><option value="interno">Interno</option></select>'+'<div class="s-chk"><label><input type="checkbox" id="nm-res"> Reserva</label><label><input type="checkbox" id="nm-nov"> Novato</label></div>'+'<div class="sheet-acts"><button class="s-cancel" onclick="closeSheet()">Cancelar</button><button class="s-ok" onclick="confirmAddMoto()">Adicionar</button></div>'+'</div></div></div>';

}
function confirmAddMoto(){
  const name=document.getElementById('nm-name').value.trim();if(!name)return;
  motos.push({id:nextId++,name,color:motos.length%PAL.length,tipo:document.getElementById('nm-tipo').value,reserva:document.getElementById('nm-res').checked,novato:document.getElementById('nm-nov').checked,disp:document.getElementById('nm-disp').value.trim(),phone:document.getElementById('nm-phone').value.trim(),history:[]});
  persist();closeSheet();perfView='equipe';renderPerformance();
}
function removeMoto(id){
  if(!confirm('Remover este entregador?'))return;
  motos=motos.filter(m=>m.id!==id);
  Object.keys(schedule).forEach(d=>{Object.keys(schedule[d]).forEach(p=>{schedule[d][p]=schedule[d][p].filter(s=>s.id!==id)})});
  persist();perfView='equipe';renderPerformance();
}
function openEditMotoSheet(id){
  const m=moto(id);if(!m)return;
  const h='<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Editar — '+m.name+'</div><div class="sheet-body">'+'<label class="s-label">Nome</label><input class="s-inp" type="text" id="em-name" value="'+m.name+'">'+'<label class="s-label">WhatsApp</label><input class="s-inp" type="tel" id="em-phone" value="'+(m.phone||'')+'">'+  '<label class="s-label">Disponibilidade</label><input class="s-inp" type="text" id="em-disp" value="'+(m.disp||'')+'">'+  '<label class="s-label">Tipo</label><select class="s-sel" id="em-tipo"><option value="externo" '+(m.tipo!=="interno"?'selected':'')+'>Externo</option><option value="interno" '+(m.tipo==="interno"?'selected':'')+'>Interno</option></select>'+'<div class="s-chk"><label><input type="checkbox" id="em-res" '+(m.reserva?'checked':'')+'>  Reserva</label><label><input type="checkbox" id="em-nov" '+(m.novato?'checked':'')+'>  Novato</label></div>'+'<div class="sheet-acts"><button class="s-cancel" onclick="closeSheet()">Cancelar</button><button class="s-ok" onclick="confirmEditMoto('+id+')">Salvar</button></div>'+'</div></div></div>';
  document.getElementById('sheet-zone').innerHTML=h;
}
function confirmEditMoto(id){
  const m=moto(id);if(!m)return;
  m.name=document.getElementById('em-name').value.trim()||m.name;
  m.phone=document.getElementById('em-phone').value.trim();
  m.disp=document.getElementById('em-disp').value.trim();
  m.tipo=document.getElementById('em-tipo').value;
  m.reserva=document.getElementById('em-res').checked;
  m.novato=document.getElementById('em-nov').checked;
  persist();closeSheet();perfView='equipe';renderPerformance();
}
// ── CSV IMPORT ──
function openImportSheet(motoId){
  document.getElementById('sheet-zone').innerHTML='<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="sheet-handle"></div>'+
  '<div class="sheet-title">📥 Importar CSV</div><div class="sheet-body">'+
  '<div style="font-size:12px;color:var(--text3);margin-bottom:10px">Formato: nome,entregas,nota_cliente,tempo_medio,frete_total<br>Ex: Rafael,47,4.8,32,1250.00</div>'+
  '<textarea class="s-inp" id="csv-raw" rows="10" style="font-family:monospace;font-size:13px;resize:vertical" placeholder="Rafael,47,4.8,32,1250.00"></textarea>'+
  '<div class="sheet-acts"><button class="s-cancel" onclick="closeSheet()">Cancelar</button><button class="s-ok" onclick="processCSV()">Importar</button></div>'+
  '</div></div></div>';
}
function processCSV(){
  const lines=document.getElementById('csv-raw').value.trim().split('\n');
  let ok=0,skip=0;
  lines.forEach(line=>{
    const[name,...rest]=line.split(',').map(s=>s.trim());
    const[ent,nota,tempo,frete]=rest.map(Number);
    const m=motos.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!m){skip++;return}
    if(!performance[m.id])performance[m.id]={deliveries:[],clientRating:0,clientCount:0,internalScore:0,reviews:[]};
    const p=performance[m.id];
    const today=new Date().toISOString().slice(0,10);
    for(let i=0;i<(ent||0);i++)p.deliveries.push({date:today,frete:(frete||0)/(ent||1),tempo:tempo||0,dow:new Date().getDay()});
    if(nota)p.clientRating=nota;
    if(ent)p.clientCount=(p.clientCount||0)+1;
    ok++;
  });
  persist();closeSheet();
  showToast(`${ok} importados${skip?', '+skip+' não encontrados':''}`);
  if(activeTab==='performance')renderPerformance();
}
// ── THEME ──
function applyTheme(t){
  const h=document.documentElement;
  h.classList.remove('force-light');
  if(t==='light')h.classList.add('force-light');
  const icon=t==='light'?'🌙':t==='dark'?'☀️':'🌓';
  const btn=document.getElementById('btn-theme');if(btn)btn.textContent=icon;
  const btn2=document.getElementById('btn-theme-desk');if(btn2)btn2.textContent=icon;
  sv('theme',t);
}
function toggleTheme(){const cur=ld('theme','auto');applyTheme(cur==='auto'?'light':cur==='light'?'dark':'auto')}
// ── DESKTOP SIDEBAR SETUP ──
function setupDesktop(){
  const isDesktop=window.innerWidth>=768;
  const hdr=document.getElementById('sidebar-hdr');
  const ftr=document.getElementById('sidebar-footer');
  if(isDesktop){if(hdr)hdr.style.display='block';if(ftr)ftr.style.display='block';}
  else{if(hdr)hdr.style.display='none';if(ftr)ftr.style.display='none';}
}
// ── INIT ──
async function initApp(){
  applyTheme(ld('theme','auto'));
  setupDesktop();
  window.addEventListener('resize',setupDesktop);
  checkMondayReminder();
  await loadFromGist();
  renderHorarios();
}
window.addEventListener('DOMContentLoaded',()=>{
  applyTheme(ld('theme','auto'));
  if(ld('loggedIn',false)){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').classList.add('visible');
    initApp();
  }
});
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&ld('loggedIn',false)){
    loadFromGist().then(()=>{
      if(activeTab==='horarios')renderHorarios();
      else if(activeTab==='performance')renderPerformance();
    });
  }
});
</script>
