<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#007AFF" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme:dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Maís Delivery">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Maís Delivery — Gestão de Entregas</title>
<style>
:root{
  --bg:#F2F2F7;--card:#FFF;--card2:#F2F2F7;--sep:#C6C6C8;--sep2:#E5E5EA;
  --text:#000;--text2:rgba(0,0,0,.6);--text3:rgba(0,0,0,.3);
  --accent:#007AFF;--green:#34C759;--green-d:#248A3D;--green-bg:#D4F0DC;
  --orange:#FF9500;--orange-d:#C93400;--orange-bg:#FFF3CD;
  --red:#FF3B30;--red-d:#C41230;--red-bg:#FFE5E5;
  --blue:#007AFF;--blue-d:#0040DD;--blue-bg:#D6EAFF;
  --tab-bar:rgba(249,249,249,.94);--tab-border:rgba(0,0,0,.12);
  --radius:12px;--radius-lg:16px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1C1C1E;--card:#2C2C2E;--card2:#3A3A3C;--sep:#48484A;--sep2:#3A3A3C;
  --text:#FFF;--text2:rgba(255,255,255,.6);--text3:rgba(255,255,255,.28);
  --green-bg:#0D3320;--orange-bg:#3D2800;--red-bg:#3D0A0A;--blue-bg:#001A3D;
  --tab-bar:rgba(28,28,30,.94);--tab-border:rgba(255,255,255,.1);
}}
html.force-dark{color-scheme:dark;--bg:#1C1C1E;--card:#2C2C2E;--card2:#3A3A3C;--sep:#48484A;--sep2:#3A3A3C;--text:#FFF;--text2:rgba(255,255,255,.6);--text3:rgba(255,255,255,.28);--green-bg:#0D3320;--orange-bg:#3D2800;--red-bg:#3D0A0A;--blue-bg:#001A3D;--tab-bar:rgba(28,28,30,.94);--tab-border:rgba(255,255,255,.1)}
html.force-light{color-scheme:light;--bg:#F2F2F7;--card:#FFF;--card2:#F2F2F7;--sep:#C6C6C8;--sep2:#E5E5EA;--text:#000;--text2:rgba(0,0,0,.6);--text3:rgba(0,0,0,.3);--green-bg:#D4F0DC;--orange-bg:#FFF3CD;--red-bg:#FFE5E5;--blue-bg:#D6EAFF;--tab-bar:rgba(249,249,249,.94);--tab-border:rgba(0,0,0,.12)}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;transition:background .25s,color .25s}

/* TOP CONTROLS */
#top-controls{position:fixed;top:calc(10px + var(--safe-t));right:14px;z-index:400;display:flex;gap:8px}
.ctrl-btn{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;background:rgba(120,120,128,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--text);transition:all .2s}
.ctrl-btn:active{transform:scale(.88)}

/* SCREENS */
.screens{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding-bottom:calc(84px + var(--safe-b))}
.screen.active{display:block}

/* TAB BAR */
.tab-bar{background:var(--tab-bar);border-top:1px solid var(--tab-border);display:flex;padding:8px 0 calc(8px + var(--safe-b));flex-shrink:0;backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:transparent;cursor:pointer;color:var(--text3);font-family:inherit;padding:2px 0;transition:color .2s}
.tab-btn.active{color:var(--accent)}
.tab-icon{font-size:22px;line-height:1.2}
.tab-label{font-size:10px;font-weight:500}

/* CARDS */
.card{background:var(--card);border-radius:var(--radius-lg);margin:0 16px 12px;overflow:hidden}
.sec-hdr{padding:22px 32px 6px;font-size:13px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:12px}
.stat-card{background:var(--card);border-radius:var(--radius-lg);padding:13px 15px}
.stat-val{font-size:28px;font-weight:700;line-height:1;margin-bottom:2px}
.stat-lbl{font-size:13px;color:var(--text2)}
.c-green{color:var(--green-d)}.c-blue{color:var(--blue)}.c-red{color:var(--red)}.c-orange{color:var(--orange)}

/* NAVBAR */
.navbar{padding:52px 16px 8px;display:flex;align-items:flex-end;justify-content:space-between}
.navbar-title{font-size:34px;font-weight:700;letter-spacing:-.5px}
.navbar-sub{font-size:13px;color:var(--text3);margin-top:1px}

/* BANNER */
.banner{margin:0 16px 12px;border-radius:var(--radius);padding:11px 13px;display:flex;gap:9px;align-items:flex-start}
.banner-fri{background:var(--orange-bg);cursor:pointer}
.banner-text{font-size:13px;font-weight:500;color:var(--orange-d);line-height:1.4}

/* DAY CARDS */
.day-card{background:var(--card);border-radius:var(--radius-lg);margin:0 16px 10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.day-card.pinned{box-shadow:0 4px 18px rgba(0,0,0,.13)}
.day-card.alert-card{border:1.5px solid var(--red)}
.day-hdr{display:flex;align-items:center;padding:12px 16px 10px;border-bottom:1px solid var(--sep2);gap:8px}
.day-name{font-size:17px;font-weight:600;flex:1}
.dbadge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.db-today{background:var(--accent);color:#fff}
.db-tom{background:var(--sep2);color:var(--text2)}
.db-crit{background:var(--orange-bg);color:var(--orange-d)}

/* PERIOD */
.period{border-bottom:1px solid var(--sep2)}
.period:last-child{border-bottom:none}
.period-hdr{display:flex;align-items:center;padding:8px 16px;background:var(--bg);gap:8px}
.period-lbl{font-size:13px;font-weight:600;color:var(--text2);flex:1;line-height:1.3}
.period-right{display:flex;align-items:center;gap:7px}
.prog-track{width:38px;height:3px;background:var(--sep2);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .3s}
.prog-ok{background:var(--green)}.prog-warn{background:var(--red)}
.prog-cnt{font-size:12px;font-weight:700}
.res-tag{font-size:11px;font-weight:600;color:var(--green-d);background:var(--green-bg);padding:2px 7px;border-radius:20px}
.alert-row{background:var(--red-bg);padding:5px 16px;font-size:12px;font-weight:600;color:var(--red-d)}

/* SLOTS */
.slot-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--sep2)}
.slot-row:last-child{border-bottom:none}
.slot-row.dispensed{opacity:.5}
.slot-row.dispensed .slot-name{text-decoration:line-through}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;color:#fff;position:relative;transition:opacity .2s}
.av.dim{opacity:.35}
.av.pulse::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--orange);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.18)}}
.slot-body{flex:1;min-width:0}
.slot-name{font-size:15px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.slot-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.slot-time{font-size:12px;color:var(--text3);background:var(--bg);padding:2px 8px;border-radius:20px;border:1px solid var(--sep2);cursor:pointer}
.slot-obs{font-size:12px;color:var(--text2);font-style:italic}
.slot-sent{font-size:11px;color:var(--blue);font-weight:500}
.badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px}
.b-res{background:var(--orange-bg);color:var(--orange-d)}
.b-nov{background:var(--green-bg);color:var(--green-d)}
.b-int{background:var(--blue-bg);color:var(--blue-d)}
.dl-ok{font-size:11px;color:var(--text3)}
.dl-warn{font-size:11px;font-weight:600;color:var(--orange)}
.dl-crit{font-size:11px;font-weight:700;color:var(--red)}
.slot-right{display:flex;align-items:center;gap:5px;flex-shrink:0}

/* STATUS */
.spill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;border:none;cursor:pointer;font-family:inherit;white-space:nowrap;-webkit-appearance:none;transition:all .2s}
.sp-pend{background:var(--sep2);color:var(--text2)}
.sp-wait{background:var(--orange-bg);color:var(--orange-d)}
.sp-conf{background:var(--green-bg);color:var(--green-d)}
.sp-disp{background:var(--red-bg);color:var(--red-d);text-decoration:line-through}

/* WA BTN */
.wa-btn{width:32px;height:32px;border-radius:50%;background:var(--green-bg);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px;flex-shrink:0;border:none;cursor:pointer;transition:all .2s}
.wa-btn:active{transform:scale(.88)}
.wa-btn.off{background:var(--sep2);opacity:.3;pointer-events:none}
.del-btn{width:26px;height:26px;border:1px solid var(--sep);border-radius:7px;background:transparent;color:var(--text3);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.del-btn:active{color:var(--red)}

/* EMPTY */
.empty-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--sep2)}
.empty-row:last-child{border-bottom:none}
.empty-av{width:34px;height:34px;border-radius:50%;border:1.5px dashed var(--sep);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:20px;flex-shrink:0}
.empty-av.red-av{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.empty-row.alert-slot{background:var(--red-bg)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.alert-slot .empty-av{animation:blink 2s infinite}

/* ADD */
.add-row{padding:9px 16px}
.add-btn{display:flex;align-items:center;gap:5px;font-size:15px;color:var(--accent);background:transparent;border:none;cursor:pointer;font-family:inherit;font-weight:500}

/* SMALL GRID */
.small-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:10px}
.small-card{background:var(--card);border-radius:var(--radius);padding:11px 12px;cursor:pointer;transition:opacity .2s}
.small-card:active{opacity:.65}
.small-card.alert-card{border:1.5px solid var(--red)}
.sc-name{font-size:13px;font-weight:600;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
.sc-period{margin-bottom:4px}
.sc-lbl{font-size:10px;color:var(--text3);margin-bottom:2px;display:flex;justify-content:space-between}
.sc-avs{display:flex;gap:2px}
.sc-av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff}

/* TIMELINE */
.tl-day-nav{display:flex;gap:7px;padding:0 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tl-day-nav::-webkit-scrollbar{display:none}
.tl-day-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--sep);background:transparent;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit}
.tl-day-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tl-wrap{margin:0 16px;background:var(--card);border-radius:var(--radius-lg);overflow:hidden}
.tl-hint{padding:7px 14px;font-size:11px;color:var(--text3);border-bottom:1px solid var(--sep2)}
.tl-canvas{position:relative;user-select:none}
.tl-hour-col{position:absolute;left:0;top:0;width:44px;bottom:0;z-index:2}
.tl-hour-lbl{position:absolute;right:6px;font-size:10px;font-weight:500;color:var(--text3);transform:translateY(-50%)}
.tl-grid-lines{position:absolute;left:44px;right:0;top:0;bottom:0;z-index:1}
.tl-grid-line{position:absolute;left:0;right:0;border-top:1px solid var(--sep2)}
.tl-grid-line.major{border-color:var(--sep)}
.tl-slots-layer{position:absolute;left:44px;right:0;top:0;bottom:0;z-index:3}
.tl-block{position:absolute;border-radius:6px;overflow:hidden;cursor:pointer}
.tl-block:active{opacity:.7}
.tl-block-inner{position:absolute;inset:0;border-radius:6px;padding:3px 6px;overflow:hidden}
.tl-block-name{font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-block-time{font-size:10px;color:rgba(255,255,255,.8)}
.tl-now-line{position:absolute;left:44px;right:0;z-index:8;pointer-events:none}
.tl-now-inner{border-top:2px solid var(--red);position:relative}
.tl-now-dot{width:8px;height:8px;background:var(--red);border-radius:50%;position:absolute;left:-4px;top:-5px}
.tl-legend{display:flex;gap:10px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--sep2)}
.tl-leg{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}
.tl-leg-dot{width:10px;height:10px;border-radius:3px}
.tl-empty{padding:32px;text-align:center;color:var(--text3);font-size:14px}

/* EQUIPE */
.moto-item{display:flex;align-items:flex-start;gap:11px;padding:12px 16px;border-bottom:1px solid var(--sep2)}
.moto-item:last-child{border-bottom:none}
.m-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.m-body{flex:1;min-width:0}
.m-name-row{font-size:16px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.m-line{font-size:13px;color:var(--text2);margin-bottom:1px;display:flex;align-items:center;gap:4px}
.m-phone-link{color:var(--accent);text-decoration:none}
.hist-dots{display:flex;gap:3px;margin-top:4px}
.hd{width:9px;height:9px;border-radius:50%}
.hd-ok{background:var(--green)}.hd-miss{background:var(--red)}.hd-empty{background:var(--sep)}
.m-pct{font-size:11px;color:var(--text3);margin-left:4px}
.m-acts{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.icon-btn{width:32px;height:32px;border:1px solid var(--sep);border-radius:10px;background:transparent;color:var(--text2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* CONFIG */
.cfg-card{background:var(--card);border-radius:var(--radius-lg);margin:0 16px;overflow:hidden}
.cfg-group-hdr{font-size:13px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;padding:20px 32px 6px}
.cfg-row{display:flex;align-items:center;padding:11px 16px;background:var(--card);border-bottom:1px solid var(--sep2);gap:8px}
.cfg-row:last-child{border-bottom:none}
.cfg-row.only{border-radius:var(--radius-lg)}
.cfg-lbl{font-size:15px;flex:1}
.cfg-sub{font-size:12px;color:var(--text3)}
.cfg-inp{width:56px;padding:6px 8px;font-size:15px;border:1px solid var(--sep);border-radius:8px;background:var(--card2);color:var(--text);text-align:center;font-family:inherit}
.cfg-inp-time{width:82px;padding:6px 8px;font-size:13px;border:1px solid var(--sep);border-radius:8px;background:var(--card2);color:var(--text);text-align:center;font-family:inherit}
.cfg-val-col{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.crit-row{display:flex;align-items:center;gap:9px;padding:11px 16px;background:var(--card);border-bottom:1px solid var(--sep2)}
.crit-row:last-child{border-bottom:none}
.crit-n{width:21px;height:21px;border-radius:50%;background:var(--orange-bg);color:var(--orange-d);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.arr-btn{width:30px;height:30px;border:1px solid var(--sep);border-radius:8px;background:transparent;font-size:16px;cursor:pointer;color:var(--text2)}
.del-turno{width:28px;height:28px;border:1px solid var(--red);border-radius:8px;background:var(--red-bg);color:var(--red);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.f-btn{width:100%;padding:13px;border-radius:var(--radius);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;border:none}
.f-btn-dest{background:var(--red-bg);color:var(--red);border:1px solid var(--red)}
.add-turno-btn{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--accent);background:transparent;border:none;cursor:pointer;font-family:inherit;font-weight:500;padding:11px 16px}

/* SHEET */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(20px + var(--safe-b))}
.sheet-handle{width:36px;height:4px;background:var(--sep);border-radius:2px;margin:12px auto 14px}
.sheet-title{font-size:17px;font-weight:600;padding:0 20px 13px;border-bottom:1px solid var(--sep2)}
.sheet-body{padding:16px 20px}
.s-label{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:5px;display:block}
.s-inp{width:100%;padding:12px 13px;font-size:16px;border:1px solid var(--sep);border-radius:var(--radius);background:var(--card2);color:var(--text);font-family:inherit;-webkit-appearance:none;margin-bottom:11px}
.s-inp:focus{outline:none;border-color:var(--accent)}
.s-sel{width:100%;padding:12px 13px;font-size:16px;border:1px solid var(--sep);border-radius:var(--radius);background:var(--card2);color:var(--text);font-family:inherit;-webkit-appearance:none;margin-bottom:11px}
.s-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.s-chk{display:flex;gap:18px;margin-bottom:13px}
.s-chk label{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--text2)}
.s-chk input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.wa-prev-lbl{font-size:11px;font-weight:700;color:var(--green-d);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.wa-preview{background:var(--green-bg);border-radius:var(--radius);padding:10px 12px;margin-bottom:13px;font-size:13px;color:var(--green-d);line-height:1.5}
.sheet-acts{display:flex;gap:9px;padding-top:3px}
.sheet-acts button{flex:1;padding:13px;border-radius:var(--radius);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;border:none}
.s-cancel{background:var(--sep2);color:var(--text2)}
.s-ok{background:var(--accent);color:#fff}
.batch-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--sep2)}
.batch-item:last-child{border-bottom:none}















</style>
</head>
<body>
<div id="top-controls">
  <button class="ctrl-btn" id="btn-theme" onclick="toggleTheme()" title="Alternar tema">🌓</button>
</div>
<div class="screens">
  <div id="screen-horarios" class="screen active"></div>
  <div id="screen-cobertura" class="screen"></div>
  <div id="screen-performance" class="screen"></div>
  <div id="screen-config" class="screen"></div>
</div>
<nav class="tab-bar">
  <button class="tab-btn active" onclick="setTab('horarios',this)"><span class="tab-icon">📅</span><span class="tab-label">Horários</span></button>
  <button class="tab-btn" onclick="setTab('cobertura',this)"><span class="tab-icon">📊</span><span class="tab-label">Cobertura</span></button>
  <button class="tab-btn" onclick="setTab('performance',this)"><span class="tab-icon">🏆</span><span class="tab-label">Time</span></button>
  <button class="tab-btn" onclick="setTab('config',this)"><span class="tab-icon">⚙️</span><span class="tab-label">Config</span></button>
</nav>
<div id="sheet-zone"></div>
<script>
// ── CONSTANTS ────────────────────────────────────────────────
const DNAMES=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DSHORT=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const STATES=['pending','waiting','confirmed','dispensed'];

// ── PERIOD FILTER ─────────────────────────────────────────────
// perfPeriod: {type:'month'|'30d'|'90d'|'custom'|'all', from:'YYYY-MM-DD', to:'YYYY-MM-DD'}
let perfPeriod=ld('perfPeriod',{type:'month'});
let perfView='ranking'; // 'ranking' | motoId
let perfFilter='all'; // 'all'|'externo'|'interno'
let perfSort='score'; // 'score'|'deliveries'|'rating'|'time'

function getPeriodDates(){
  const now=new Date();
  const toStr=d=>d.toISOString().slice(0,10);
  if(perfPeriod.type==='month'){
    const from=new Date(now.getFullYear(),now.getMonth(),1);
    return{from:toStr(from),to:toStr(now)};
  }
  if(perfPeriod.type==='30d'){
    const from=new Date(now-30*864e5);
    return{from:toStr(from),to:toStr(now)};
  }
  if(perfPeriod.type==='90d'){
    const from=new Date(now-90*864e5);
    return{from:toStr(from),to:toStr(now)};
  }
  if(perfPeriod.type==='custom'){
    return{from:perfPeriod.from||toStr(new Date(now-30*864e5)),to:perfPeriod.to||toStr(now)};
  }
  return{from:'2020-01-01',to:toStr(now)}; // all
}

function getPerfForPeriod(motoId){
  const {from,to}=getPeriodDates();
  const perf=performance[motoId]||{};
  const deliveries=(perf.deliveries||[]).filter(d=>d.date>=from&&d.date<=to);
  const totalDel=deliveries.length;
  const totalFrete=deliveries.reduce((a,b)=>a+(b.frete||0),0);
  const avgTime=totalDel>0?deliveries.reduce((a,b)=>a+(b.tempo||0),0)/totalDel:0;
  // ratings are global (not time-filtered) since CSV doesn't always have per-entry dates
  const clientRating=perf.clientRating||0;
  const clientCount=perf.clientCount||0;
  const internalScore=perf.internalScore||0;
  // day breakdown
  const dayCount={};
  deliveries.forEach(d=>{if(d.dow!=null)dayCount[d.dow]=(dayCount[d.dow]||0)+1});
  return{totalDel,totalFrete,avgTime,clientRating,clientCount,internalScore,dayCount,deliveries};
}

function hoursUntil(dl){
  if(!dl)return null;const match=dl.match(/(\d{1,2})h/);if(!match)return null;
  const now=new Date(),t=new Date();t.setHours(parseInt(match[1]),0,0,0);
  if(t<now)t.setDate(t.getDate()+1);
  return Math.round((t-now)/3600000);
}
function deadlineEl(dl,status){
  if(!dl||status==='confirmed'||status==='dispensed')return'';
  const h=hoursUntil(dl);
  if(h===null)return`<span class="dl-ok">⏱ ${dl}</span>`;
  if(h<=1)return`<span class="dl-crit">⏱ ${h===0?'agora!':h+'h'}</span>`;
  if(h<=3)return`<span class="dl-warn">⏱ ${h}h</span>`;
  return`<span class="dl-ok">⏱ ${dl}</span>`;
}

// ── SCORE ─────────────────────────────────────────────────────
function calcScore(motoId){
  try{
    const m=moto(motoId);if(!m)return 0;
    const {totalDel,avgTime,clientRating,clientCount,internalScore}=getPerfForPeriod(motoId);
    const hist=m.history||[];
    const presScore=hist.length?hist.reduce((a,b)=>a+b,0)/hist.length:0.5;
    const logs=changeLog.filter(l=>l.motoId===motoId&&l.toStatus==='dispensed');
    const lateCancel=logs.filter(l=>l.note&&l.note.includes('cima')).length;
    const punctScore=Math.max(0,1-(lateCancel*0.15));
    const clientScore=clientCount>0?(clientRating/5)*Math.min(1,Math.log10(clientCount+1)/2):0;
    const allDel=motos.map(mm=>getPerfForPeriod(mm.id).totalDel);
    const maxDel=Math.max(...allDel,1);
    const delivScore=totalDel/maxDel;
    const allTimes=motos.map(mm=>getPerfForPeriod(mm.id).avgTime).filter(t=>t>0);
    const minT=allTimes.length?Math.min(...allTimes):0,maxT=allTimes.length?Math.max(...allTimes):1;
    const timeScore=avgTime>0?1-((avgTime-minT)/Math.max(maxT-minT,1)):0.5;
    const intScore=internalScore/5;
    const raw=presScore*0.30+punctScore*0.20+clientScore*0.20+delivScore*0.10+timeScore*0.10+intScore*0.10;
    return Math.round(raw*100)/10;
  }catch{return 0}
}

// ── SOUND ─────────────────────────────────────────────────────
function playSound(type){
  if(!soundEnabled)return;
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    if(type==='alert'){o.frequency.value=880;g.gain.setValueAtTime(.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.4);}
    else if(type==='confirm'){o.frequency.value=440;g.gain.setValueAtTime(.2,ctx.currentTime);o.frequency.linearRampToValueAtTime(660,ctx.currentTime+.2);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.5);}
    else{o.frequency.value=330;g.gain.setValueAtTime(.15,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);}
    o.start();o.stop(ctx.currentTime+.5);
  }catch{}
}

  const t=document.createElement('div');
  t.style.cssText=`position:fixed;bottom:calc(92px + var(--safe-b,0px));left:50%;transform:translateX(-50%);background:${type==='ok'?'#248A3D':'#C41230'};color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:999;pointer-events:none;white-space:nowrap`;
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),300)},2200);
}

function setTab(name,btn){
  try{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('screen-'+name).classList.add('active');
    activeTab=name;
    if(name==='horarios')renderHorarios();
    else if(name==='cobertura')renderCobertura();
    else if(name==='performance')renderPerformance();
    else if(name==='equipe'){document.getElementById('screen-performance').classList.add('active');activeTab='performance';renderPerformance();return;}
    else renderConfig();
  }catch(e){console.error(e)}
}

// ── HORÁRIOS ──────────────────────────────────────────────────
function renderHorarios(){
  try{
    const tod=new Date().getDay(),tom=(tod+1)%7,isFri=tod===5;
    const allReal=Object.values(schedule).flatMap(d=>Object.values(d).flat()).filter(s=>s&&s.id&&s.status!=='dispensed');
    const conf=allReal.filter(s=>s.status==='confirmed').length;
    const wait=allReal.filter(s=>s.status==='waiting').length;
    const alertN=[0,1,2,3,4,5,6].filter(d=>getPeriods(d).some(p=>isAlert(d,p))).length;
    if(alertN>0)playSound('alert');

    let h=`<div class="navbar"><div><div class="navbar-title">Horários</div><div class="navbar-sub">${DNAMES[tod]}, ${new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long'})}</div></div>
    <div style="display:flex;gap:8px;padding-bottom:8px">
      <button onclick="applyWeekModel()" style="font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid var(--sep);background:transparent;color:var(--accent);cursor:pointer;font-family:inherit">📋 Modelo</button>
      <button onclick="saveWeekModel()" style="font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid var(--sep);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit">💾 Salvar</button>
    </div></div>`;

      <div class="stat-card"><div class="stat-val c-green">${conf}</div><div class="stat-lbl">Confirmados</div></div>
      <div class="stat-card"><div class="stat-val c-orange">${wait}</div><div class="stat-lbl">Aguardando</div></div>
      <div class="stat-card"><div class="stat-val ${alertN>0?'c-red':'c-green'}">${alertN}</div><div class="stat-lbl">Alertas</div></div>
    </div>`;
    if(isFri){
      const wp=[0,6].flatMap(d=>getPeriods(d).flatMap(p=>(schedule[d]?.[p]||[]).filter(s=>s.id&&(s.status==='pending'||s.status==='waiting')))).length;
      h+=`<div class="banner banner-fri" onclick="openBatchSheet()"><span>⚠️</span><span class="banner-text">Sexta — ${wp} pendente${wp!==1?'s':''} no fim de semana. Toque para confirmar em lote →</span></div>`;
    }
    h+=`<div class="sec-hdr">Hoje</div>${dayCard(tod,'today')}`;
    h+=`<div class="sec-hdr">Amanhã</div>${dayCard(tom,'tomorrow')}`;
    const critDays=[...new Set(critOrder.filter(c=>c.day!==tod&&c.day!==tom).map(c=>c.day))];
    if(critDays.length){h+=`<div class="sec-hdr">Dias Críticos</div>`;critDays.forEach((d,i)=>h+=dayCard(d,'critical',i+1))}
    const others=[0,1,2,3,4,5,6].filter(d=>d!==tod&&d!==tom&&!critDays.includes(d));
    if(others.length){h+=`<div class="sec-hdr">Semana</div><div class="small-grid">`;others.forEach(d=>h+=smallCard(d));h+=`</div>`}
    document.getElementById('screen-horarios').innerHTML=h;
  }catch(e){document.getElementById('screen-horarios').innerHTML=`<p style="padding:20px;color:red">Erro: ${e.message}</p>`}

function dayCard(di,type,critN){
  ensurePeriods(di);
  const hasAlert=getPeriods(di).some(p=>isAlert(di,p));
  const badge=type==='today'?`<span class="dbadge db-today">Hoje</span>`:type==='tomorrow'?`<span class="dbadge db-tom">Amanhã</span>`:`<span class="dbadge db-crit">#${critN}</span>`;
  let h=`<div class="day-card ${type==='today'?'pinned':''} ${hasAlert?'alert-card':''}"><div class="day-hdr">${badge}<span class="day-name">${DNAMES[di]}</span></div>`;
  getPeriods(di).forEach(p=>h+=periodBlock(di,p));
  return h+`</div>`;
}

function periodBlock(di,period){
  ensurePeriods(di);
  const t=getTurnos(di)[period];
  const min=t?.min||0,conf=cConf(di,period);
  const slots=schedule[di][period]||[];
  const realSlots=slots.filter(s=>s.id&&s.status!=='dispensed');
  const alert=conf<min||realSlots.length<min;
  const pct=min>0?Math.min(100,Math.round(conf/min*100)):100;
  const missing=Math.max(0,min-realSlots.length);
  let h=`<div class="period">
    <div class="period-hdr">
      <span class="period-lbl">${t?.emoji||''} ${t?.label||period}${t?.start?`<br><span style="font-size:11px;font-weight:400;color:var(--text3)">${t.start}–${t.end}</span>`:''}</span>
      <div class="period-right">
        <div style="display:flex;align-items:center;gap:5px">
          <div class="prog-track"><div class="prog-fill ${alert?'prog-warn':'prog-ok'}" style="width:${pct}%"></div></div>
          <span class="prog-cnt" style="color:${alert?'var(--red)':'var(--green-d)'}">${conf}/${min}</span>
        </div>
        ${hasReserve(di,period)?`<span class="res-tag">reserva ✓</span>`:''}
      </div>
    </div>
    ${alert?`<div class="alert-row">⚠ faltam ${min-conf} confirmação${min-conf>1?'ões':''}</div>`:''}
    <div>`;
  slots.forEach((s,i)=>{
    if(!s.id||s.status==='empty'){
      h+=`<div class="empty-row ${alert?'alert-slot':''}"><div class="empty-av ${alert?'red-av':''}">+</div><span style="flex:1;font-size:14px;color:${alert?'var(--red)':'var(--text3)'}">Vaga em aberto</span><button class="del-btn" onclick="removeSlot(${di},'${period}',${i})">✕</button></div>`;
      return;
    }
    const m=moto(s.id);if(!m)return;
    const col=palCol(s.id),tLabel=t?.label||period;
    const wa=waLink(m.phone,m.name,di,tLabel,s.timeStart,s.timeEnd);
    const avCls=s.status==='dispensed'?'dim':s.status==='waiting'?'pulse':'';
    h+=`<div class="slot-row ${s.status==='dispensed'?'dispensed':''}">
      <div class="av ${avCls}" style="background:${col}">${ini(m.name)}</div>
      <div class="slot-body">
        <div class="slot-name">${m.name}${m.reserva?'<span class="badge b-res">reserva</span>':''}${m.novato?'<span class="badge b-nov">novato</span>':''}${m.tipo==='interno'?'<span class="badge b-int">interno</span>':''}</div>
        <div class="slot-meta">
          <span class="slot-time" onclick="editSlotSheet(${di},'${period}',${i})">${slotTimeStr(s)}</span>
          ${s.obs?`<span class="slot-obs">${s.obs}</span>`:''}
          ${s.sentAt?`<span class="slot-sent">📤 ${s.sentAt}</span>`:''}
          ${deadlineEl(s.deadline,s.status)}
        </div>
      </div>
      <div class="slot-right">
        <button class="spill ${SCLASS[s.status]}" onclick="cycleState(${di},'${period}',${i})">${SLABELS[s.status]}</button>
        <a class="wa-btn${wa?'':' off'}" ${wa?`href="${wa}" target="_blank" onclick="onWaTap(${di},'${period}',${i},event)"`:''}>${WA_SVG}</a>
        <button class="del-btn" onclick="removeSlot(${di},'${period}',${i})">✕</button>
      </div>
    </div>`;
  });
  for(let x=0;x<missing;x++){
    h+=`<div class="empty-row alert-slot"><div class="empty-av red-av">!</div><span style="flex:1;font-size:13px;color:var(--red)">Vaga necessária</span><button class="add-btn" style="padding:0;font-size:13px" onclick="openAddSheet(${di},'${period}')">+ Add</button></div>`;
  }
  return h+`</div><div class="add-row"><button class="add-btn" onclick="openAddSheet(${di},'${period}')">＋ Adicionar motoboy</button></div></div>`;
}

function smallCard(di){
  ensurePeriods(di);
  const ps=getPeriods(di),alert=ps.some(p=>isAlert(di,p));
  let h=`<div class="small-card ${alert?'alert-card':''}" onclick="expandDaySheet(${di})"><div class="sc-name">${DNAMES[di]}${alert?` <span style="color:var(--red)">⚠</span>`:''}</div>`;
  ps.forEach(p=>{
    const t=getTurnos(di)[p],slots=(schedule[di]?.[p]||[]).filter(s=>s.id&&s.status!=='dispensed');
    const c=cConf(di,p),m2=getMin(di,p);
    h+=`<div class="sc-period"><div class="sc-lbl">${t?.emoji||''} ${t?.label||p} <span style="color:${c<m2?'var(--red)':''};font-weight:700">${c}/${m2}</span></div><div class="sc-avs">${slots.slice(0,4).map(s=>{const mm=moto(s.id);return mm?`<div class="sc-av" style="background:${palCol(s.id)}">${ini(mm.name)}</div>`:''}).join('')}</div></div>`;
  });
  return h+`</div>`;
}

function cycleState(d,p,i){
  const s=schedule[d][p][i],from=s.status;
  s.status=STATES[(STATES.indexOf(s.status)+1)%STATES.length];
  if(s.status==='confirmed')playSound('confirm');
  addLog(s.id,from,s.status);
  persist();renderHorarios();
}
function onWaTap(d,p,i,e){
  const s=schedule[d][p][i],from=s.status;
  s.status='waiting';s.sentAt=nowStr();
  addLog(s.id,from,'waiting','manual','wa_tap');
  persist();setTimeout(()=>renderHorarios(),200);
}
function removeSlot(d,p,i){schedule[d][p].splice(i,1);persist();renderHorarios();closeSheet()}

// ── TIMELINE ──────────────────────────────────────────────────
const H_START=6,H_END=24,PX_H=56;
function timeToH(t){if(!t)return null;const[h,m]=t.split(':').map(Number);return h+m/60}
function hToY(h){return(h-H_START)*PX_H}

function renderCobertura(){
  try{
    const totalPx=(H_END-H_START)*PX_H,now=new Date(),nowH=now.getHours()+now.getMinutes()/60,isToday=tlDay===now.getDay();
    let nav=`<div class="tl-day-nav">`;
    for(let i=0;i<7;i++)nav+=`<button class="tl-day-btn ${i===tlDay?'active':''}" onclick="setTlDay(${i})">${DSHORT[i]}</button>`;
    nav+=`</div>`;
    ensurePeriods(tlDay);
    const allSlots=Object.values(schedule[tlDay]||{}).flat().filter(s=>s&&s.id&&s.timeStart&&s.timeEnd&&s.status!=='dispensed');
    function layoutCols(items){
      const parsed=items.map(s=>({...s,sh:timeToH(s.timeStart),eh:timeToH(s.timeEnd)})).filter(s=>s.sh!=null&&s.eh>s.sh);
      parsed.sort((a,b)=>a.sh-b.sh);
      const cols=[];
      parsed.forEach(item=>{let placed=false;for(let c=0;c<cols.length;c++){if(cols[c][cols[c].length-1].eh<=item.sh){cols[c].push(item);placed=true;break}}if(!placed)cols.push([item])});
      const res=[];cols.forEach((col,ci)=>col.forEach(item=>res.push({...item,col:ci,totalCols:cols.length})));
      return res;
    }
    const pos=layoutCols(allSlots);
    let hLines='',hLabels='';
    for(let h=H_START;h<=H_END;h++){const y=hToY(h);hLines+=`<div class="tl-grid-line ${h%2===0?'major':''}" style="top:${y}px"></div>`;hLabels+=`<div class="tl-hour-lbl" style="top:${y}px">${h===24?'00':String(h).padStart(2,'0')}h</div>`;}
    let blocks='';
    pos.forEach(s=>{
      const m=moto(s.id);if(!m)return;
      const col=palCol(s.id),top=hToY(s.sh),height=Math.max((s.eh-s.sh)*PX_H,24);
      const colW=100/s.totalCols,left=s.col*colW;
      const op=s.status==='pending'?0.55:s.status==='waiting'?0.75:1;
      let oP='',oI=0;
      Object.entries(schedule[tlDay]||{}).forEach(([pp,arr])=>{arr.forEach((sl,ii)=>{if(sl&&sl.id===s.id&&sl.timeStart===s.timeStart){oP=pp;oI=ii}})});
      blocks+=`<div class="tl-block" style="top:${top}px;height:${height}px;left:calc(${left}% + 2px);width:calc(${colW}% - 4px);opacity:${op}" onclick="editSlotSheet(${tlDay},'${oP}',${oI})"><div class="tl-block-inner" style="background:${col}"><div class="tl-block-name">${m.name}</div><div class="tl-block-time">${s.timeStart}–${s.timeEnd}</div></div></div>`;
    });
    const legend=[...new Set(allSlots.map(s=>s.id))].map(id=>{const m=moto(id);return m?`<div class="tl-leg"><div class="tl-leg-dot" style="background:${palCol(id)}"></div>${m.name}</div>`:''}).join('');
    let h=`<div class="navbar"><div><div class="navbar-title">Cobertura</div><div class="navbar-sub">${DNAMES[tlDay]}</div></div></div>`;
    h+=nav+`<div class="tl-wrap"><div class="tl-hint">👆 Toque em uma barra para editar</div>`;
    if(allSlots.length===0){h+=`<div class="tl-empty">Nenhum motoboy em turno neste dia.</div>`}
    else{h+=`<div style="overflow-y:auto;max-height:65vh;-webkit-overflow-scrolling:touch"><div class="tl-canvas" style="height:${totalPx}px;position:relative"><div class="tl-hour-col" style="height:${totalPx}px">${hLabels}</div><div class="tl-grid-lines" style="height:${totalPx}px">${hLines}</div><div class="tl-slots-layer" style="height:${totalPx}px">${blocks}</div>${isToday&&nowH>=H_START&&nowH<=H_END?`<div class="tl-now-line" style="top:${hToY(nowH)}px"><div class="tl-now-inner"><div class="tl-now-dot"></div></div></div>`:''}</div></div>${legend?`<div class="tl-legend">${legend}</div>`:''}`}
    h+=`</div>`;
    document.getElementById('screen-cobertura').innerHTML=h;
  }catch(e){document.getElementById('screen-cobertura').innerHTML=`<p style="padding:20px;color:red">Erro: ${e.message}</p>`}
}
function setTlDay(d){tlDay=d;renderCobertura()}

function renderPerformance(){
  try{
    if(perfView==='equipe')renderEquipe();
    else if(typeof perfView==='number')renderProfile(perfView);
    else renderRanking();
  }catch(e){document.getElementById('screen-performance').innerHTML=`<p style="padding:20px;color:red">Erro: ${e.message}</p>`}

function periodLabel(){
  if(perfPeriod.type==='month')return'Este mês';
  if(perfPeriod.type==='30d')return'Últimos 30 dias';
  if(perfPeriod.type==='90d')return'Últimos 90 dias';
  if(perfPeriod.type==='all')return'Todo período';
  const{from,to}=getPeriodDates();return`${from.slice(8)}/${from.slice(5,7)} – ${to.slice(8)}/${to.slice(5,7)}`;
}

function periodBar(){
  const opts=[{v:'month',l:'Este mês'},{v:'30d',l:'30 dias'},{v:'90d',l:'90 dias'},{v:'all',l:'Tudo'},{v:'custom',l:'Período'}];
  return`<div style="display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none">
    ${opts.map(o=>`<button onclick="setPeriod('${o.v}')" style="flex-shrink:0;padding:5px 12px;border-radius:20px;border:1px solid ${perfPeriod.type===o.v?'var(--accent)':'var(--sep)'};background:${perfPeriod.type===o.v?'var(--accent)':'transparent'};color:${perfPeriod.type===o.v?'#fff':'var(--text2)'};font-size:12px;font-weight:500;cursor:pointer;font-family:inherit">${o.l}</button>`).join('')}

function setPeriod(v){perfPeriod={type:v};if(v==='custom'){perfPeriod.from=new Date(Date.now()-30*864e5).toISOString().slice(0,10);perfPeriod.to=new Date().toISOString().slice(0,10)}persist();renderPerformance()}
function setCustomFrom(v){perfPeriod.from=v;persist();renderPerformance()}
function setCustomTo(v){perfPeriod.to=v;persist();renderPerformance()}

    <button onclick="perfView='equipe';renderPerformance()" style="flex:1;padding:10px;border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:500;color:var(--text3);cursor:pointer">🛵 Equipe</button>

    </div>
  </div>`;

  h+=`<div style="display:flex;border-bottom:1px solid var(--sep2)">

    <button onclick="perfView='equipe';renderPerformance()" style="flex:1;padding:10px;border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:600;color:var(--accent);border-bottom:2px solid var(--accent);cursor:pointer">🛵 Equipe</button>

function renderProfile(motoId){
  const m=moto(motoId);if(!m){perfView='ranking';renderRanking();return}
  const score=calcScore(motoId);
  const col=palCol(motoId);
  const p=getPerfForPeriod(motoId);
  const perf=performance[motoId]||{};
  const logs=changeLog.filter(l=>l.motoId===motoId).slice(0,30);

function toggleTipo(id){const m=moto(id);if(!m)return;m.tipo=m.tipo==='interno'?'externo':'interno';persist();renderProfile(id)}

function setRating(key,val,motoId){
  if(!performance[motoId])performance[motoId]={};
  performance[motoId][key]=val;
  const keys=['r_comportamento','r_comunicacao','r_pontualidade'].filter(k=>performance[motoId][k]);
  performance[motoId].internalScore=keys.length?keys.reduce((a,k)=>a+(performance[motoId][k]||0),0)/keys.length:0;
  persist();renderProfile(motoId);
}

function submitReview(motoId){
  const type=document.getElementById('rev-type')?.value;
  const note=document.getElementById('rev-note')?.value.trim();
  if(!performance[motoId])performance[motoId]={};
  if(!performance[motoId].reviews)performance[motoId].reviews=[];
  performance[motoId].reviews.unshift({type,note,ts:new Date().toISOString()});
  persist();showToast('Avaliação salva!');renderProfile(motoId);
}

function importCSV(event,type){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const lines=e.target.result.split(/\r?\n/).filter(l=>l.trim());
      let count=0;
      const status=document.getElementById('import-status');
      const skipNames=['NATAN','FELIPE','HENRIQUE','OTAVIO'];
      const shouldSkip=name=>skipNames.some(n=>name.toUpperCase().includes(n));

      if(type==='avaliacoes'){
        lines.forEach(line=>{
          const p=line.split(',');
          const name=(p[0]||'').replace(/"/g,'').trim();
          if(!name||['entregador','periodo','relat'].some(s=>name.toLowerCase().includes(s)))return;
          if(shouldSkip(name))return;
          const qtdAval=parseInt(p[2])||0;
          const notaRaw=(p[6]||p[3]||'').replace(/"/g,'').replace(',','.').trim();
          const nota=parseFloat(notaRaw);
          if(!nota||isNaN(nota))return;
          const m=findMotoByName(name);
          if(m){
            if(!performance[m.id])performance[m.id]={};
            performance[m.id].clientRating=nota;
            performance[m.id].clientCount=qtdAval;
            count++;
          }
        });
        if(status)status.innerHTML=`✅ Avaliações: ${count} motoboys atualizados`;
      }

      else if(type==='tempo'){
        lines.forEach(line=>{
          const p=line.split(',');
          const name=(p[0]||'').replace(/"/g,'').trim();
          if(!name||name.toLowerCase().includes('entregador'))return;
          if(shouldSkip(name))return;
          const qtd=parseInt((p[1]||'').replace(/"/g,''))||0;
          const tempo=parseFloat((p[3]||'').replace(/"/g,''))||0;
          const m=findMotoByName(name);
          if(m&&tempo>0){
            if(!performance[m.id])performance[m.id]={};
            performance[m.id].avgTime=tempo;
            count++;
          }
        });
        if(status)status.innerHTML+=`<br>✅ Tempos: ${count} motoboys atualizados`;
      }

      else if(type==='entregas'){
        // Entregador, Dt.Pedido, Dt.Entrega, Estabelecimento, ID, Pagamento, FreteGratis, Vl.Entrega, Vl.Produtos, Vl.Total...
        lines.forEach(line=>{
          const p=parseCSVLine(line);
          const name=(p[0]||'').replace(/"/g,'').trim();
          if(!name||name==='Entregador'||name.startsWith('TOTAIS'))return;
          if(shouldSkip(name))return;
          const dtStr=(p[1]||'').replace(/"/g,'').trim();
          const dtEntStr=(p[2]||'').replace(/"/g,'').trim();
          const frete=parseFloat((p[7]||'').replace(/"/g,'').replace(',','.'))||0;
          if(!dtStr)return;
          const dateParts=dtStr.split(' ')[0].split('/');
          if(dateParts.length<3)return;
          const dateObj=new Date(parseInt(dateParts[2]),parseInt(dateParts[1])-1,parseInt(dateParts[0]));
          const dateISO=dateObj.toISOString().slice(0,10);
          const dow=dateObj.getDay();
          // calc delivery time
          let tempo=0;
          if(dtEntStr){
            const t1=new Date(dtStr.replace(/(\d{2})\/(\d{2})\/(\d{4})\s/,'$3-$2-$1T'));
            const t2=new Date(dtEntStr.replace(/(\d{2})\/(\d{2})\/(\d{4})\s/,'$3-$2-$1T'));
            if(!isNaN(t1)&&!isNaN(t2)&&t2>t1)tempo=Math.round((t2-t1)/60000);
          }
          const m=findMotoByName(name);
          if(m){
            if(!performance[m.id])performance[m.id]={};
            if(!performance[m.id].deliveries)performance[m.id].deliveries=[];
            // avoid duplicates for same day (keep first entry per date per simple approach)
            performance[m.id].deliveries.push({date:dateISO,dow,frete,tempo});
            count++;
          }
        });
        // recalc avgTime for those updated
        motos.forEach(m=>{
          const dels=(performance[m.id]?.deliveries||[]).filter(d=>d.tempo>0);
          if(dels.length)performance[m.id].avgTime=dels.reduce((a,b)=>a+b.tempo,0)/dels.length;
        });
        if(status)status.innerHTML+=`<br>✅ Entregas: ${count} registros processados`;
      }

      persist();playSound('confirm');
    }catch(err){
      const status=document.getElementById('import-status');
      if(status)status.innerHTML=`❌ Erro: ${err.message}`;
      console.error(err);
    }
  };
  reader.readAsText(file,'UTF-8');
}

function parseCSVLine(line){
  const result=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){inQ=!inQ}
    else if(c===','&&!inQ){result.push(cur);cur=''}
    else{cur+=c}
  }
  result.push(cur);return result;
}

function findMotoByName(csvName){
  const clean=n=>n.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,'');
  const cn=clean(csvName);
  let found=motos.find(m=>clean(m.name)===cn);if(found)return found;
  found=motos.find(m=>cn.includes(clean(m.name))||clean(m.name).includes(cn));if(found)return found;
  const cFirst=cn.split(' ')[0];
  found=motos.find(m=>clean(m.name).startsWith(cFirst)||cFirst.startsWith(clean(m.name).split('')[0]));
  return found||null;
}

// ── SUGGESTIONS ───────────────────────────────────────────────
function getSuggestions(di,period,limit=3){
  const candidates=motos.filter(m=>m.tipo==='externo');
  const scored=candidates.map(m=>{
    let s=0;
    (weekHistory||[]).forEach(w=>{const slots=(w[di]?.[period]||[]);if(slots.some(sl=>sl.id===m.id&&sl.status==='confirmed'))s+=2});
    s+=(performance[m.id]?.[`r_day_${di}`]||0)*0.5;
    const hist=m.history||[];s+=hist.length?hist.reduce((a,b)=>a+b,0)/hist.length*3:0;
    const already=(schedule[di][period]||[]).some(sl=>sl.id===m.id);
    if(already)s=-99;
    return{m,s};
  });
  return scored.filter(x=>x.s>-99).sort((a,b)=>b.s-a.s).slice(0,limit).map(x=>x.m);
}

  </div></div>`;
  tipos.forEach(([key,label])=>{
    h+=`<div class="cfg-group-hdr">${label}</div><div class="cfg-card">`;
    Object.entries(turnos[key]).forEach(([p,t])=>{
      h+=`<div class="cfg-row"><div style="flex:1"><div class="cfg-lbl">${t.emoji||''} ${t.label}</div><div class="cfg-sub">mín. confirmados</div></div>
        <div class="cfg-val-col">
          <input class="cfg-inp-time" type="time" value="${t.start}" onchange="setTurno('${key}','${p}','start',this.value)">
          <span style="color:var(--text3)">–</span>
          <input class="cfg-inp-time" type="time" value="${t.end}" onchange="setTurno('${key}','${p}','end',this.value)">
          <input class="cfg-inp" type="number" min="0" max="20" value="${t.min}" onchange="setTurno('${key}','${p}','min',+this.value)">
          <button class="del-turno" onclick="deleteTurno('${key}','${p}')">✕</button>
        </div></div>`;
    });
    h+=`<button class="add-turno-btn" onclick="openAddTurnoSheet('${key}','${label}')">＋ Adicionar turno</button></div>`;
  });
  h+=`<div class="cfg-group-hdr">Mensagem WhatsApp</div>
  <div style="padding:0 16px;margin-bottom:12px">
    <div style="font-size:12px;color:var(--text3);margin-bottom:6px">Variáveis: {nome} {dia} {turno} {inicio} {fim}</div>
    <textarea style="width:100%;padding:12px;font-size:14px;border:1px solid var(--sep);border-radius:var(--radius);background:var(--card);color:var(--text);font-family:inherit;min-height:78px;resize:vertical" onchange="sv('waTmpl',this.value)">${ld('waTmpl','Opa {nome}! Tudo certo pra você entregar {dia} de {turno}, das {inicio} às {fim}? Me confirma por favor! 🛵')}</textarea>
  </div>
  <div class="cfg-group-hdr">Dias Críticos</div>
  <div class="cfg-card">${critOrder.map((c,i)=>`<div class="crit-row"><div class="crit-n">${i+1}</div><span style="flex:1;font-size:15px">${c.label}</span>${i>0?`<button class="arr-btn" onclick="moveCrit(${i},-1)">↑</button>`:'<div style="width:30px"></div>'}${i<critOrder.length-1?`<button class="arr-btn" onclick="moveCrit(${i},1)">↓</button>`:'<div style="width:30px"></div>'}</div>`).join('')}</div>
  <div style="padding:16px;margin-bottom:8px">
    <button class="f-btn f-btn-dest" onclick="resetWeek()">🔄 Resetar grade da semana</button>
    <p style="font-size:12px;color:var(--text3);text-align:center;margin-top:10px">Dados salvos localmente neste dispositivo.</p>
  </div>`;
  document.getElementById('screen-config').innerHTML=h;
}

function setTurno(key,p,field,val){turnos[key][p][field]=val;persist()}
function deleteTurno(key,p){if(Object.keys(turnos[key]).length<=1){alert('Precisa de ao menos 1 turno.');return}if(!confirm(`Remover "${turnos[key][p].label}"?`))return;delete turnos[key][p];persist();renderConfig()}
function moveCrit(i,dir){const t=critOrder[i+dir];critOrder[i+dir]=critOrder[i];critOrder[i]=t;persist();renderConfig()}
function resetWeek(){if(!confirm('Resetar a grade? Entregadores mantidos.'))return;Object.keys(schedule).forEach(d=>{ensurePeriods(+d);getPeriods(+d).forEach(p=>{schedule[d][p]=[]})});persist();renderHorarios()}

// ── SHEETS ────────────────────────────────────────────────────
function closeSheet(){const z=document.getElementById('sheet-zone');if(z)z.innerHTML=''}

function openAddSheet(di,period){
  ensurePeriods(di);
  const t=getTurnos(di)[period];
  const suggestions=getSuggestions(di,period,3);
  const opts=motos.map(m=>`<option value="${m.id}">${m.name}${m.tipo==='interno'?' (interno)':''}${m.reserva?' (reserva)':''}${m.novato?' (novato)':''}</option>`).join('');
  const first=motos[0];const prev=first?waMsg(first.name,di,t?.label||period,t?.start,t?.end):'';
  const sugHtml=suggestions.length?`<div style="margin-bottom:12px"><div class="s-label">💡 Sugeridos pelo histórico</div><div style="display:flex;gap:7px;flex-wrap:wrap">${suggestions.map(m=>`<button onclick="document.getElementById('sm-m').value=${m.id};updatePrev(${di},'${period}')" style="display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;border:1px solid var(--accent);background:var(--blue-bg);color:var(--blue-d);cursor:pointer;font-family:inherit;font-size:12px;font-weight:500"><div style="width:20px;height:20px;border-radius:50%;background:${palCol(m.id)};color:#fff;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700">${ini(m.name)}</div>${m.name}</button>`).join('')}</div></div>`:'';
  document.getElementById('sheet-zone').innerHTML=`<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Adicionar — ${DNAMES[di]} ${t?.label||period}</div><div class="sheet-body">
    ${sugHtml}
    <label class="s-label">Motoboy</label><select class="s-sel" id="sm-m" onchange="updatePrev(${di},'${period}')">${opts}</select>
    <div class="s-grid2"><div><label class="s-label">Início</label><input class="s-inp" type="time" id="sm-ts" value="${t?.start||'18:30'}" oninput="updatePrev(${di},'${period}')"></div><div><label class="s-label">Fim</label><input class="s-inp" type="time" id="sm-te" value="${t?.end||'23:30'}" oninput="updatePrev(${di},'${period}')"></div></div>
    <label class="s-label">Observação</label><input class="s-inp" type="text" id="sm-o" placeholder="ex: Roberto no lugar">
    <label class="s-label">Prazo de confirmação</label><input class="s-inp" type="text" id="sm-d" placeholder="ex: até sex 17h">
    <div class="wa-prev-lbl">📱 Mensagem WhatsApp</div><div class="wa-preview" id="sm-prev">${prev}</div>
    <div class="sheet-acts"><button class="s-cancel" onclick="closeSheet()">Cancelar</button><button class="s-ok" onclick="confirmAdd(${di},'${period}')">Adicionar</button></div>
  </div></div></div>`;
}
function updatePrev(di,period){
  const sel=document.getElementById('sm-m'),ts=document.getElementById('sm-ts'),te=document.getElementById('sm-te'),prev=document.getElementById('sm-prev');
  if(!sel||!prev)return;const m=moto(parseInt(sel.value));if(!m)return;
  const t=getTurnos(di)[period];prev.textContent=waMsg(m.name,di,t?.label||period,ts?.value,te?.value);
}
function confirmAdd(d,p){
  ensurePeriods(d);
  schedule[d][p].push({id:parseInt(document.getElementById('sm-m').value),timeStart:document.getElementById('sm-ts').value,timeEnd:document.getElementById('sm-te').value,obs:document.getElementById('sm-o').value.trim(),deadline:document.getElementById('sm-d').value.trim(),status:'pending',sentAt:''});
  persist();closeSheet();renderHorarios();
}
function editSlotSheet(d,p,i){
  const s=schedule[d]?.[p]?.[i];if(!s||!s.id)return;
  const m=moto(s.id);if(!m)return;
  document.getElementById('sheet-zone').innerHTML=`<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Editar — ${m.name}</div><div class="sheet-body">
    <div class="s-grid2"><div><label class="s-label">Início</label><input class="s-inp" type="time" id="es-ts" value="${s.timeStart||''}"></div><div><label class="s-label">Fim</label><input class="s-inp" type="time" id="es-te" value="${s.timeEnd||''}"></div></div>
    <label class="s-label">Observação</label><input class="s-inp" type="text" id="es-o" value="${s.obs||''}" placeholder="Observação">
    <label class="s-label">Prazo</label><input class="s-inp" type="text" id="es-d" value="${s.deadline||''}" placeholder="ex: até sex 17h">
    <label class="s-label">Registrar cancelamento?</label>
    <select class="s-sel" id="es-cancel"><option value="">Não</option><option value="cima">Sim — em cima da hora (−2 pts)</option><option value="antecedencia">Sim — com antecedência (−1 pt)</option></select>
    <div class="sheet-acts"><button class="s-cancel" onclick="closeSheet()">Cancelar</button><button class="s-ok" onclick="confirmEditSlot(${d},'${p}',${i})">Salvar</button></div>
  </div></div></div>`;
}
function confirmEditSlot(d,p,i){
  const s=schedule[d][p][i];
  s.timeStart=document.getElementById('es-ts').value;
  s.timeEnd=document.getElementById('es-te').value;
  s.obs=document.getElementById('es-o').value.trim();
  s.deadline=document.getElementById('es-d').value.trim();
  const cancel=document.getElementById('es-cancel')?.value;
  if(cancel){addLog(s.id,s.status,'dispensed','manual',cancel==='cima'?'cancelamento em cima da hora':'cancelamento com antecedência');s.status='dispensed';playSound('alert')}
  persist();closeSheet();if(activeTab==='horarios')renderHorarios();else renderCobertura();
}
function expandDaySheet(di){
  ensurePeriods(di);
  let inner=`<div class="sheet-handle"></div><div class="sheet-title">${DNAMES[di]}</div>`;
  getPeriods(di).forEach(p=>inner+=periodBlock(di,p));
  document.getElementById('sheet-zone').innerHTML=`<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet">${inner}</div></div>`;
}
function openBatchSheet(){
  let items='';
  [0,6].forEach(di=>{
    ensurePeriods(di);
    getPeriods(di).forEach(p=>{
      const t=getTurnos(di)[p];
      (schedule[di][p]||[]).forEach((s,i)=>{
        if(!s.id||(s.status!=='pending'&&s.status!=='waiting'))return;
        const m=moto(s.id);if(!m)return;
        const wa=waLink(m.phone,m.name,di,t?.label||p,s.timeStart,s.timeEnd);
        items+=`<div class="batch-item"><div class="av" style="background:${palCol(s.id)};width:30px;height:30px;font-size:10px">${ini(m.name)}</div><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">${m.name}</div><div style="font-size:12px;color:var(--text3)">${DNAMES[di]} · ${t?.label||p}</div></div><span class="spill ${SCLASS[s.status]}" style="cursor:default;font-size:10px">${SLABELS[s.status]}</span><a class="wa-btn${wa?'':' off'}" ${wa?`href="${wa}" target="_blank" onclick="onWaTap(${di},'${p}',${i},event)"`:''}>${WA_SVG}</a></div>`;
      });
    });
  });
  if(!items)items='<div style="padding:20px;text-align:center;color:var(--text3)">Nenhum pendente 🎉</div>';
  document.getElementById('sheet-zone').innerHTML=`<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Confirmações — Fim de semana</div><div class="sheet-body">${items}</div></div></div>`;
}
function openAddTurnoSheet(key,label){
  document.getElementById('sheet-zone').innerHTML=`<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Novo turno — ${label}</div><div class="sheet-body">
    <label class="s-label">Nome</label><input class="s-inp" type="text" id="nt-label" placeholder="ex: Madrugada">
    <label class="s-label">Emoji</label><input class="s-inp" type="text" id="nt-emoji" placeholder="🌃" maxlength="2">
    <div class="s-grid2"><div><label class="s-label">Início</label><input class="s-inp" type="time" id="nt-start" value="00:00"></div><div><label class="s-label">Fim</label><input class="s-inp" type="time" id="nt-end" value="04:00"></div></div>
    <label class="s-label">Mínimo confirmados</label><input class="s-inp" type="number" id="nt-min" value="2" min="0" max="20">
    <div class="sheet-acts"><button class="s-cancel" onclick="closeSheet()">Cancelar</button><button class="s-ok" onclick="confirmAddTurno('${key}')">Adicionar</button></div>
  </div></div></div>`;
}
function confirmAddTurno(key){
  const label=document.getElementById('nt-label').value.trim();if(!label){alert('Digite o nome.');return}
  const p=label.toLowerCase().replace(/\s+/g,'_');
  turnos[key][p]={label,emoji:document.getElementById('nt-emoji').value.trim(),start:document.getElementById('nt-start').value,end:document.getElementById('nt-end').value,min:parseInt(document.getElementById('nt-min').value)||0};
  persist();closeSheet();renderConfig();
}
function openAddMotoSheet(){
  document.getElementById('sheet-zone').innerHTML=`<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Novo Entregador</div><div class="sheet-body">
    <label class="s-label">Nome</label><input class="s-inp" type="text" id="nm-name" placeholder="Nome completo">
    <label class="s-label">WhatsApp</label><input class="s-inp" type="tel" id="nm-phone" placeholder="69999999999">
    <label class="s-label">Disponibilidade</label><input class="s-inp" type="text" id="nm-disp" placeholder="ex: noites seg-sex">
    <label class="s-label">Tipo</label><select class="s-sel" id="nm-tipo"><option value="externo">Externo</option><option value="interno">Interno</option></select>
    <div class="s-chk"><label><input type="checkbox" id="nm-res"> Reserva</label><label><input type="checkbox" id="nm-nov"> Novato</label></div>
    <div class="sheet-acts"><button class="s-cancel" onclick="closeSheet()">Cancelar</button><button class="s-ok" onclick="confirmAddMoto()">Adicionar</button></div>
  </div></div></div>`;
}
function confirmAddMoto(){
  const name=document.getElementById('nm-name').value.trim();if(!name)return;
  motos.push({id:nextId++,name,color:motos.length%PAL.length,tipo:document.getElementById('nm-tipo').value,reserva:document.getElementById('nm-res').checked,novato:document.getElementById('nm-nov').checked,disp:document.getElementById('nm-disp').value.trim(),phone:document.getElementById('nm-phone').value.trim(),history:[]});
  persist();closeSheet();renderEquipe();
}
function openEditMotoSheet(id){
  const m=moto(id);if(!m)return;
  document.getElementById('sheet-zone').innerHTML=`<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Editar — ${m.name}</div><div class="sheet-body">
    <label class="s-label">Nome</label><input class="s-inp" type="text" id="em-name" value="${m.name}">
    <label class="s-label">WhatsApp</label><input class="s-inp" type="tel" id="em-phone" value="${m.phone||''}" placeholder="69999999999">
    <label class="s-label">Disponibilidade</label><input class="s-inp" type="text" id="em-disp" value="${m.disp||''}">
    <label class="s-label">Tipo</label><select class="s-sel" id="em-tipo"><option value="externo" ${m.tipo!=='interno'?'selected':''}>Externo</option><option value="interno" ${m.tipo==='interno'?'selected':''}>Interno</option></select>
    <div class="s-chk"><label><input type="checkbox" id="em-res" ${m.reserva?'checked':''}> Reserva</label><label><input type="checkbox" id="em-nov" ${m.novato?'checked':''}> Novato</label></div>
    <div class="sheet-acts"><button class="s-cancel" onclick="closeSheet()">Cancelar</button><button class="s-ok" onclick="confirmEditMoto(${id})">Salvar</button></div>
  </div></div></div>`;
}
function confirmEditMoto(id){
  const m=moto(id);if(!m)return;
  m.name=document.getElementById('em-name').value.trim()||m.name;
  m.phone=document.getElementById('em-phone').value.trim();
  m.disp=document.getElementById('em-disp').value.trim();
  m.tipo=document.getElementById('em-tipo').value;
  m.reserva=document.getElementById('em-res').checked;
  m.novato=document.getElementById('em-nov').checked;
  persist();closeSheet();renderEquipe();
}
function removeMoto(id){
  if(!confirm('Remover este entregador?'))return;
  motos=motos.filter(m=>m.id!==id);
  Object.keys(schedule).forEach(d=>{Object.keys(schedule[d]).forEach(p=>{schedule[d][p]=schedule[d][p].filter(s=>s.id!==id)})});
  persist();renderEquipe();
}
function applyTheme(t){
  const h=document.documentElement;
  h.classList.remove('force-light','force-dark');
  if(t==='light')h.classList.add('force-light');
  else if(t==='dark')h.classList.add('force-dark');
  const btn=document.getElementById('btn-theme');
  if(btn)btn.textContent=t==='light'?'🌙':t==='dark'?'☀️':'🌓';
  sv('theme',t);
}
function toggleTheme(){const cur=ld('theme','auto');applyTheme(cur==='auto'?'dark':cur==='dark'?'light':'auto')}
function isDesktopDevice(){return false}
function applyLayout(d){}
function toggleLayout(){}
try{
  applyTheme(ld('theme','auto'));
      checkMondayReminder();
  renderHorarios();
}catch(e){
  console.error('Init error:',e);
  document.body.innerHTML=`<div style="padding:30px;font-family:sans-serif"><h2 style="color:red">Erro ao iniciar</h2><p style="margin-top:8px">${e.message}</p></div>`;
}

</script>
